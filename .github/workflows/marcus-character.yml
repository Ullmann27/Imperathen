name: Marcus – authored Blender character and actual campaign review
on:
  push:
    branches: ['feat/marcus-authored-character-20261126', 'feat/facial-eye-rig-20261127']
permissions:
  contents: read
jobs:
  marcus:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_REQUIRE_MARCUS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned Blender
        run: |
          set -euo pipefail
          mkdir -p artifacts/marcus
          git rev-parse HEAD > artifacts/marcus/SOURCE_COMMIT.txt
          bash tools/characters/install_marcus_blender.sh "$RUNNER_TEMP/marcus-blender"
      - name: Create actual editable character, renders and four mobile GLBs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/marcus-blender/blender" -b -t 4 --python-exit-code 1 -P tools/characters/build_marcus.py -- --evidence artifacts/marcus 2>&1 | tee artifacts/marcus/blender.log
          python3 tools/characters/validate_hero.py prototype/assets/characters/marcus_quality_{0,1,2,3}.glb --report artifacts/marcus/validation.json
          mkdir -p artifacts/marcus/runtime
          cp prototype/assets/characters/marcus_quality_*.glb prototype/assets/characters/marcus_eye_calibration.json artifacts/marcus/runtime/
          sha256sum artifacts/marcus/runtime/*.glb > artifacts/marcus/GLB_SHA256SUMS.txt
      - name: Install checksum-verified Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          file="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fLsS --retry 3 "$base/$file" -o "$file"
          awk -v n="$file" '$2 == n || $2 == "*" n {print $1 "  " n}' SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$file"
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import actual character and test its real village route
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --only import marcus_character village_people --report artifacts/marcus/engine
      - name: Render verified Blender character for review
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/marcus-blender/blender" -b -t 4 --python-exit-code 1 -P tools/characters/build_marcus.py -- --output "$RUNNER_TEMP/marcus-studio" --evidence artifacts/marcus/studio --render 2>&1 | tee artifacts/marcus/studio.log
      - name: Capture actual Godot village character
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          export IMPERATHEN_ISOLATED_TEST=1 LIBGL_ALWAYS_SOFTWARE=1
          export XDG_DATA_HOME="$RUNNER_TEMP/marcus-review-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/marcus-review-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/marcus-review-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" artifacts/marcus/godot
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1280x720 --fixed-fps 60 --disable-render-loop --script res://tests/marcus_engine_review.gd -- --output="$GITHUB_WORKSPACE/artifacts/marcus/godot" 2>&1 | tee artifacts/marcus/godot/runtime.log
          grep -q MARCUS_ENGINE_REVIEW_PASS artifacts/marcus/godot/runtime.log
      - name: Upload genuine model files and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-marcus-character-${{ github.run_id }}
          path: artifacts/marcus/
          if-no-files-found: error
          retention-days: 30
