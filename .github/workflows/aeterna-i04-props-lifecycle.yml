name: AETERNA forge carried prop lifecycle
on:
  pull_request:
    branches: ['integration/aeterna-visual-mounted-20261128']
    types: [opened, synchronize, reopened]
    paths: ['prototype/scripts/world/village/i04_props.gd', 'prototype/tests/i04_props_lifecycle_test.gd', '.github/workflows/aeterna-i04-props-lifecycle.yml']
permissions:
  contents: read
concurrency:
  group: aeterna-i04-props-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'fix/aeterna-i04-props-lifecycle-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin source and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/i04-props
          git rev-parse HEAD > artifacts/i04-props/source.txt
          git hash-object prototype/scripts/world/village/i04_props.gd > artifacts/i04-props/module-blob.txt
          git hash-object prototype/tests/i04_props_lifecycle_test.gd > artifacts/i04-props/test-blob.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Actual forge presentation and unchanged story regression
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/i04-props-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/i04-props-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/i04-props-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/i04-props/import.log
          status=0
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/i04_props_lifecycle_test.gd 2>&1 | tee artifacts/i04-props/lifecycle.log || status=1
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --script res://tests/i04_slice_test.gd 2>&1 | tee artifacts/i04-props/story.log || status=1
          test "$status" -eq 0
          grep -Fxq I04_PROPS_LIFECYCLE_PASS artifacts/i04-props/lifecycle.log
          grep -Eq '^I04_PROPS_LIFECYCLE_RESULT checks=[1-9][0-9]* failures=0$' artifacts/i04-props/lifecycle.log
          grep -Fxq I04_SLICE_PASS artifacts/i04-props/story.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:|^I04_PROPS_FAIL' artifacts/i04-props/{lifecycle,story}.log; then exit 1; fi
      - name: Retain actual engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-i04-props-${{ github.run_id }}
          path: artifacts/i04-props/
          if-no-files-found: warn
          retention-days: 14
