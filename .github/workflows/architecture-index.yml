name: IMPERATHEN architecture index
on:
  push:
    branches: ['setup/architecture-foundation']
    paths:
      - 'AGENTS.md'
      - 'ARCHITEKTUR_INDEX.md'
      - 'tools/architecture/**'
      - '.github/workflows/architecture-index.yml'
  pull_request:
    paths:
      - 'prototype/scripts/**'
      - 'prototype/project.godot'
      - 'AGENTS.md'
      - 'ARCHITEKTUR_INDEX.md'
      - 'tools/architecture/**'
      - '.github/workflows/architecture-index.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check declaration inventory generator
        run: node tools/architecture/test_index.mjs
      - name: Verify or bootstrap architecture index
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ARCHITEKTUR_INDEX.md ]]; then
            node tools/architecture/build_index.mjs --check
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/setup/architecture-foundation ]]; then
            node tools/architecture/build_index.mjs
            node tools/architecture/build_index.mjs --check
            node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const bytes=readFileSync('ARCHITEKTUR_INDEX.md');
          const data=bytes.toString('base64');
          const chunks=data.match(/.{1,6000}/g)??[];
          console.log('ARCH_INDEX_META '+JSON.stringify({head:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),blob:execFileSync('git',['hash-object','ARCHITEKTUR_INDEX.md'],{encoding:'utf8'}).trim(),bytes:bytes.length,chunks:chunks.length}));
          chunks.forEach((value,i)=>console.log('ARCH_INDEX_CHUNK '+i+' '+value));
          NODE
          else
            echo "Missing committed ARCHITEKTUR_INDEX.md" >&2
            exit 1
          fi
