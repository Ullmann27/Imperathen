name: Aeterna actual guard reassignment in dry and rainy weather
on:
  push:
    branches: ['fix/aeterna-guard-weather-fixture-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Actual Godot commerce and weather regression
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/guard-weather-fixture"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          timeout --kill-after=10s 300s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee "$out/import.log"
          run_check() {
            local name="$1" marker="$2" state
            state="$(mktemp -d "$RUNNER_TEMP/guard-weather-fixture.XXXXXX")"
            mkdir -p "$state"/{data,config,cache}
            XDG_DATA_HOME="$state/data" XDG_CONFIG_HOME="$state/config" XDG_CACHE_HOME="$state/cache" timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script "res://tests/$name.gd" 2>&1 | tee "$out/$name.log"
            grep -Fq "$marker" "$out/$name.log"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$out/$name.log"; then exit 1; fi
          }
          run_check commerce_transaction_test COMMERCE_TRANSACTION_PASS
          run_check local_weather_test LOCAL_WEATHER_PASS
          run_check npc_behavior_test 'checks passed'
      - name: Retain actual engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-guard-weather-fixture-${{ github.run_id }}
          path: artifacts/guard-weather-fixture/
          if-no-files-found: warn
          retention-days: 30
