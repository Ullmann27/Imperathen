name: Aeterna regional map scale actual viewport
on:
  push:
    branches: ['fix/aeterna-regional-map-scale-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official verified Godot and display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Actual Godot map at every zoom tier
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/map-scale"
          mkdir -p "$out" "$RUNNER_TEMP/map-state"/{data,config,cache}
          export XDG_DATA_HOME="$RUNNER_TEMP/map-state/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/map-state/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/map-state/cache"
          git rev-parse HEAD > "$out/commit.txt"
          timeout --kill-after=10s 300s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee "$out/import.log"
          timeout --kill-after=10s 120s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 --script res://tests/regional_map_test.gd -- "$out" 2>&1 | tee "$out/map.log"
          grep -Fq REGIONAL_MAP_PASS "$out/map.log"
          if grep -Eq 'ERROR:|SCRIPT ERROR:' "$out/map.log"; then exit 1; fi
          for shot in local village routes district region; do test -s "$out/map-$shot.png"; done
      - name: Preserve actual rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-map-scale-${{ github.run_id }}
          path: artifacts/map-scale/
          if-no-files-found: warn
          retention-days: 30
