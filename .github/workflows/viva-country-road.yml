name: VIVA ROMA country road - actual 3D review
on:
  pull_request:
    paths:
      - 'prototype/assets/viva_country/**'
      - 'prototype/scripts/viva_country/**'
      - 'prototype/shaders/viva_country/**'
      - 'prototype/scenes/viva_country/**'
      - 'prototype/tests/viva_country_test.gd'
      - 'tools/viva_country/**'
      - '.github/workflows/viva-country-road.yml'
permissions:
  contents: read
concurrency:
  group: viva-country-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Regenerate actual 3D assets and check byte identity
        run: |
          set -euo pipefail
          node tools/viva_country/generate.mjs "$RUNNER_TEMP/country"
          for f in prototype/assets/viva_country/*.glb prototype/assets/viva_country/scatter_*.json; do
            cmp "$f" "$RUNNER_TEMP/country/$(basename "$f")"
          done
          python3 - "$RUNNER_TEMP/country" <<'PY'
          import json, math, pathlib, sys
          a=json.loads(pathlib.Path('prototype/assets/viva_country/manifest.json').read_text())
          b=json.loads((pathlib.Path(sys.argv[1])/'manifest.json').read_text())
          def eq(a,b):
              if isinstance(a,dict): return a.keys()==b.keys() and all(eq(a[k],b[k]) for k in a)
              if isinstance(a,list): return len(a)==len(b) and all(eq(x,y) for x,y in zip(a,b))
              if isinstance(a,(int,float)): return math.isclose(a,b,rel_tol=1e-10,abs_tol=1e-10)
              return a==b
          assert eq(a,b)
          PY
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Get official Godot and graphical test environment
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/godot"; cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          archive="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path("Godot_v4.7.2-stable_linux.x86_64.zip")
          sums={s.split()[-1].lstrip("*"):s.split()[0] for s in pathlib.Path("SHA512-SUMS.txt").read_text().splitlines() if s.strip()}
          with p.open("rb") as f: assert hashlib.file_digest(f,"sha512").hexdigest()==sums[p.name]
          with zipfile.ZipFile(p) as z: z.extractall()
          PY
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and verify actual terrain collisions and sun directions
        run: |
          set -euo pipefail
          mkdir -p country-evidence
          git rev-parse HEAD > country-evidence/commit.txt
          python3 tools/viva_country/prepare_fixture.py "$RUNNER_TEMP/country-fixture"
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/country-fixture" --import --quit 2>&1 | tee country-evidence/import.log
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/country-fixture" --quit-after 240 --script res://tests/viva_country_test.gd 2>&1 | tee country-evidence/physics.log
          grep -q 'VIVA_COUNTRY_PASS' country-evidence/physics.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' country-evidence/physics.log; then exit 1; fi
      - name: Capture five actual 3D Godot viewport images
        run: |
          set -euo pipefail
          timeout 360 xvfb-run -a -s "-screen 0 1440x900x24" "$GODOT_BIN" --path "$RUNNER_TEMP/country-fixture" --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1280x720 --script res://tests/viva_country_test.gd -- --capture="$PWD/country-evidence" 2>&1 | tee country-evidence/render.log
          grep -q 'VIVA_COUNTRY_PASS' country-evidence/render.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|^ERROR:' country-evidence/render.log; then exit 1; fi
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('country-evidence')
          report=json.loads((root/'review.json').read_text())
          assert report['renderer']=='gl_compatibility' and not report['errors']
          assert len(report['captures'])==5
          for row in report['captures']:
              assert hashlib.sha256((root/(row['id']+'.png')).read_bytes()).hexdigest()==row['sha256']
          assert len({x['sha256'] for x in report['captures'][:3]})==3
          PY
      - name: Upload real images and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viva-country-${{ github.run_number }}
          path: country-evidence/
          if-no-files-found: warn
          retention-days: 14
