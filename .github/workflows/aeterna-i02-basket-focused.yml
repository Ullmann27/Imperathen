name: AETERNA I02 basket isolated verification
on:
  pull_request:
    branches: ['candidate/aeterna-i02-basket-20261128']
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/aeterna-i02-basket-focused.yml']
permissions:
  contents: read
concurrency:
  group: aeterna-i02-basket-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'qa/aeterna-i02-basket-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the exact transferred files and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/i02-basket
          git rev-parse HEAD > artifacts/i02-basket/source.txt
          git hash-object prototype/scripts/world/village/i02_props.gd | tee artifacts/i02-basket/module-blob.txt
          git hash-object prototype/tests/i02_props_test.gd | tee artifacts/i02-basket/test-blob.txt
          test "$(cat artifacts/i02-basket/module-blob.txt)" = '1f7966a6ffd1d3e28aab6e4475c481ac94439d43'
          test "$(cat artifacts/i02-basket/test-blob.txt)" = '074f1219df2b87058ac7ecff05374988b962b66e'
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Import and run actual I02 regression
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/i02-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/i02-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/i02-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/i02-basket/import.log
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --script res://tests/i02_props_test.gd 2>&1 | tee artifacts/i02-basket/test.log
          grep -Fxq I02_PROPS_PASS artifacts/i02-basket/test.log
          grep -Eq '^I02_PROPS_RESULT checks=[1-9][0-9]* failures=0$' artifacts/i02-basket/test.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:|I02_PROPS_FAIL' artifacts/i02-basket/test.log; then exit 1; fi
      - name: Preserve source-bound test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-i02-basket-${{ github.run_id }}
          path: artifacts/i02-basket/
          if-no-files-found: warn
          retention-days: 14
