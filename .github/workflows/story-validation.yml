name: Story and cinematic contract

on:
  push:
    branches:
      - 'story/i00-aquileia-cold-open-20261123'
  pull_request:
    paths:
      - 'prototype/assets/story/**'
      - 'prototype/scripts/story/**'
      - 'prototype/scripts/cinematic/**'
      - 'prototype/tests/campaign_bible_test.gd'
      - 'prototype/tests/village_childhood_test.gd'
      - 'prototype/tests/childhood_integration_test.gd'
      - 'prototype/tests/opening_story_test.gd'
      - 'prototype/tests/opening_director_test.gd'
      - 'prototype/tests/opening_flow_test.gd'
      - 'tools/story/**'
      - 'tests/android_campaign_bible_test.py'
      - '.github/workflows/story-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-derived campaign registry
        run: |
          python3 tools/story/validate_campaign_arc.py
          python3 -m unittest tests.android_campaign_bible_test
      - name: Install official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          expected="$(awk '/Godot_v4.7.2-stable_linux.x86_64.zip$/ {print $1}' SHA512-SUMS.txt)"
          actual="$(sha512sum godot.zip | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path prototype --import
      - name: Run campaign and childhood contracts
        run: |
          "$GODOT_BIN" --headless --path prototype --script res://tests/campaign_bible_test.gd
          "$GODOT_BIN" --headless --path prototype --script res://tests/village_childhood_test.gd
          "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/childhood_integration_test.gd
      - name: Run opening and I-00 cinematic contracts
        run: |
          "$GODOT_BIN" --headless --path prototype --script res://tests/opening_story_test.gd
          "$GODOT_BIN" --headless --path prototype --script res://tests/opening_director_test.gd
          "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/opening_flow_test.gd
