name: Story and cinematic contract

on:
  push:
    branches:
      - 'story/i00-aquileia-cold-open-20261123'
  pull_request:
    paths:
      - 'prototype/assets/story/**'
      - 'prototype/scripts/story/**'
      - 'prototype/scripts/cinematic/**'
      - 'prototype/tests/campaign_bible_test.gd'
      - 'prototype/tests/village_childhood_test.gd'
      - 'prototype/tests/i01_slice_test.gd'
      - 'prototype/tests/i01_flow_test.gd'
      - 'prototype/tests/key_mission_attempts_test.gd'
      - 'prototype/tests/mission_cinematics_test.gd'
      - 'prototype/scripts/world/village/i01_*.gd'
      - 'prototype/scripts/visuals/character_motion.gd'
      - 'prototype/scripts/visuals/village_person.gd'
      - 'prototype/tests/i03_slice_test.gd'
      - 'prototype/tests/i03_flow_test.gd'
      - 'prototype/tests/i03_support.gd'
      - 'prototype/tests/childhood_integration_test.gd'
      - 'prototype/tests/opening_story_test.gd'
      - 'prototype/tests/opening_director_test.gd'
      - 'prototype/tests/opening_flow_test.gd'
      - 'prototype/tests/i00_stage_test.gd'
      - 'tools/story/**'
      - 'tests/android_campaign_bible_test.py'
      - '.github/workflows/story-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  story-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate source-derived campaign registry
        run: |
          python3 tools/story/validate_campaign_arc.py
          python3 -m unittest tests.android_campaign_bible_test
      - name: Install official Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          expected="$(awk '/Godot_v4.7.2-stable_linux.x86_64.zip$/ {print $1}' SHA512-SUMS.txt)"
          actual="$(sha512sum godot.zip | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path prototype --import
      - name: Run campaign and childhood contracts
        shell: bash
        run: |
          set -euo pipefail
          run_story_test() {
            local test_state
            test_state="$(mktemp -d "$RUNNER_TEMP/story-contract.XXXXXX")"
            mkdir -p "$test_state/data" "$test_state/config" "$test_state/cache"
            XDG_DATA_HOME="$test_state/data" \
            XDG_CONFIG_HOME="$test_state/config" \
            XDG_CACHE_HOME="$test_state/cache" \
            IMPERATHEN_ISOLATED_TEST=1 \
              timeout --kill-after=10s 120s "$GODOT_BIN" --headless --path prototype "$@"
          }
          run_story_test --script res://tests/campaign_bible_test.gd
          run_story_test --script res://tests/village_childhood_test.gd
          run_story_test --script res://tests/i01_slice_test.gd
          run_story_test --script res://tests/key_mission_attempts_test.gd
          run_story_test --script res://tests/mission_cinematics_test.gd
          run_story_test --script res://tests/i03_slice_test.gd
          run_story_test --fixed-fps 60 --script res://tests/childhood_integration_test.gd
      - name: Run opening and I-00 cinematic contracts
        shell: bash
        run: |
          set -euo pipefail
          run_story_test() {
            local test_state
            test_state="$(mktemp -d "$RUNNER_TEMP/story-contract.XXXXXX")"
            mkdir -p "$test_state/data" "$test_state/config" "$test_state/cache"
            XDG_DATA_HOME="$test_state/data" \
            XDG_CONFIG_HOME="$test_state/config" \
            XDG_CACHE_HOME="$test_state/cache" \
            IMPERATHEN_ISOLATED_TEST=1 \
              timeout --kill-after=10s 120s "$GODOT_BIN" --headless --path prototype "$@"
          }
          run_story_test --script res://tests/opening_story_test.gd
          run_story_test --script res://tests/opening_director_test.gd
          run_story_test --script res://tests/i00_stage_test.gd
          run_story_test --fixed-fps 60 --script res://tests/opening_flow_test.gd
          run_story_test --fixed-fps 60 --script res://tests/i01_flow_test.gd
          run_story_test --fixed-fps 60 --script res://tests/i03_flow_test.gd
