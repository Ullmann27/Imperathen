name: AETERNA Preview – strict Marcus turn candidate
on:
  push:
    branches: ['fix/aeterna-preview-companion-turn-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_REQUIRE_MARCUS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Build and verify the actual Marcus rig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/preview-motion
          git rev-parse HEAD > artifacts/preview-motion/source.txt
          bash tools/characters/install_marcus_blender.sh "$RUNNER_TEMP/marcus-blender"
          "$RUNNER_TEMP/marcus-blender/blender" -b -t 2 --python-exit-code 1 -P tools/characters/build_marcus.py -- --evidence artifacts/preview-motion/marcus
          python3 tools/characters/validate_hero.py prototype/assets/characters/marcus_quality_{0,1,2,3}.glb --report artifacts/preview-motion/marcus-validation.json
          test -s prototype/assets/characters/marcus_quality_0.glb
      - name: Actual Godot strict 30 60 120 Hz companion regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/preview-motion/import.log
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/companion_turn_motion_test.gd 2>&1 | tee artifacts/preview-motion/turn.log
          grep -Fq COMPANION_TURN_MOTION_PASS artifacts/preview-motion/turn.log
          test "$(grep -c '^COMPANION_CASE ' artifacts/preview-motion/turn.log)" -eq 6
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/preview-motion/turn.log; then exit 1; fi
      - name: Preserve source-bound motion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-preview-marcus-turn-${{ github.run_id }}
          path: artifacts/preview-motion/
          if-no-files-found: warn
          retention-days: 30
