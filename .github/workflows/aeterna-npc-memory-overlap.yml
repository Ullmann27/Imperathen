name: AETERNA NPC observation memory integrity
on:
  pull_request:
    branches: ['integration/aeterna-visual-mounted-20261128']
    types: [opened, synchronize, reopened]
    paths: ['prototype/scripts/domain/npc_social_memory.gd', 'prototype/tests/npc_social_memory_test.gd', '.github/workflows/aeterna-npc-memory-overlap.yml']
permissions:
  contents: read
concurrency:
  group: aeterna-npc-memory-overlap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'fix/aeterna-npc-memory-overlap-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin source and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/npc-memory
          git rev-parse HEAD > artifacts/npc-memory/source.txt
          git hash-object prototype/scripts/domain/npc_social_memory.gd > artifacts/npc-memory/module-blob.txt
          git hash-object prototype/tests/npc_social_memory_test.gd > artifacts/npc-memory/test-blob.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Verify actual social memory, NPC decisions, world and simulation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --only import npc_social_memory npc_behavior npc_physical_conversation team_b_integration --report artifacts/npc-memory/headless
          grep -E '^NPC social memory: [1-9][0-9]* checks passed' artifacts/npc-memory/headless/npc_social_memory.log
          grep -Fq 'NPC_PHYSICAL_CONVERSATION_PASS' artifacts/npc-memory/headless/npc_physical_conversation.log
          grep -Fq 'TEAM_B_INTEGRATION_PASS' artifacts/npc-memory/headless/team_b_integration.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/npc-memory/headless/{npc_social_memory,npc_behavior,npc_physical_conversation,team_b_integration}.log; then exit 1; fi
      - name: Preserve source-bound test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-npc-memory-${{ github.run_id }}
          path: artifacts/npc-memory/
          if-no-files-found: warn
          retention-days: 14
