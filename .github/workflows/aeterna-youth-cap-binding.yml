name: AETERNA actual civilian youth cap binding audit
on:
  push:
    branches: ['fix/aeterna-youth-cap-binding-20261127', 'fix/aeterna-youth-capture-on-demand-20261128']
permissions:
  contents: read
concurrency:
  group: aeterna-youth-cap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded dependencies and run negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/youth-cap
          git rev-parse HEAD > artifacts/youth-cap/source.txt
          timeout 300s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          timeout 600s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-numpy python3-scipy python3-pil xvfb xauth libgl1-mesa-dri
          /usr/bin/python3 -m unittest discover -s tools/art -p test_youth_cap_binding.py -v 2>&1 | tee artifacts/youth-cap/unit.log
      - name: Stage actual owner-derived youth using existing checksum contract
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/characters/stage_original_youth.py --archive "$RUNNER_TEMP/youth-source.zip" --report artifacts/youth-cap/original-stage.json
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 'https://accad.ohio-state.edu/sites/accad.osu.edu/files/Male2_bvh.zip' -o "$RUNNER_TEMP/accad-male2.zip"
          timeout --kill-after=15s 1200s /usr/bin/python3 tools/characters/stage_youth_civil.py --source prototype/assets/characters --accad-archive "$RUNNER_TEMP/accad-male2.zip" --work "$RUNNER_TEMP/youth-work" 2>&1 | tee artifacts/youth-cap/staging.log
          for i in 0 1 2 3; do test -s "prototype/assets/characters/hero_meshy_italia_civil_$i.glb"; done
          sha256sum prototype/assets/characters/hero_meshy_italia_civil_{0,1,2,3}.glb > artifacts/youth-cap/V1_ASSET_SHA256.txt
      - name: Measure and generate isolated weight-only candidate
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          result=0
          timeout --kill-after=10s 420s /usr/bin/python3 tools/art/youth_cap_binding.py --input prototype/assets/characters --output "$RUNNER_TEMP/youth-candidate" --report artifacts/youth-cap/binding-audit.json 2>&1 | tee artifacts/youth-cap/audit.log || result=$?
          echo "audit_exit=$result" >> "$GITHUB_OUTPUT"
          test -s artifacts/youth-cap/binding-audit.json
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Compare actual original and candidate Godot frames
        shell: bash
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.audit_exit }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/youth-cap"
          for version in V1 V2; do
            if [[ "$version" == V2 ]]; then
              test "$AUDIT_EXIT" = 0 || break
              cp "$RUNNER_TEMP"/youth-candidate/hero_meshy_italia_civil_{0,1,2,3}.glb prototype/assets/characters/
              sha256sum prototype/assets/characters/hero_meshy_italia_civil_{0,1,2,3}.glb > "$out/V2_ASSET_SHA256.txt"
            fi
            mkdir -p "$out/$version" "$RUNNER_TEMP/youth-$version"/{data,config,cache}
            export XDG_DATA_HOME="$RUNNER_TEMP/youth-$version/data"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/youth-$version/config"
            export XDG_CACHE_HOME="$RUNNER_TEMP/youth-$version/cache"
            timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee "$out/$version/import.log"
            timeout --kill-after=10s 300s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/youth_outfit_skin_test.gd 2>&1 | tee "$out/$version/skin.log"
            grep -Fq YOUTH_OUTFIT_SKIN_PASS "$out/$version/skin.log"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$out/$version/skin.log"; then exit 1; fi
            timeout --kill-after=10s 360s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --script res://tests/youth_outfit_review.gd -- "$out/$version" --capture-on-demand 2>&1 | tee "$out/$version/render.log"
            for outfit in armoured civil; do
              for view in front three_quarter side face walk; do
                test -s "$out/$version/${outfit}_${view}.png"
              done
            done
            test -s "$out/$version/youth-outfit-review.json"
            grep -Fq 'YOUTH_OUTFIT_REVIEW []' "$out/$version/render.log"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$out/$version/render.log"; then exit 1; fi
            mkdir -p "$out/$version/studio"
            timeout --kill-after=10s 360s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --script res://tests/youth_outfit_review.gd -- "$out/$version/studio" --capture-on-demand --studio 2>&1 | tee "$out/$version/studio/render.log"
            for outfit in armoured civil; do
              for view in front three_quarter side face walk attack; do
                test -s "$out/$version/studio/${outfit}_${view}.png"
              done
            done
            test -s "$out/$version/studio/youth-studio-review.json"
            grep -Fq 'YOUTH_STUDIO_REVIEW []' "$out/$version/studio/render.log"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$out/$version/studio/render.log"; then exit 1; fi
          done
          if cmp -s "$out/V1_ASSET_SHA256.txt" "$out/V2_ASSET_SHA256.txt"; then
            printf '%s\n' 'IDENTICAL_ASSETS: V2 is an independent control render, not an asset repair.' > "$out/CONTROL_ONLY.txt"
          fi
          printf '%s\n' 'Independent visual review and device acceptance pending. No private GLB included.' > "$out/REVIEW_PENDING.txt"
          test "$AUDIT_EXIT" = 0
      - name: Record actual frame hashes even for partial failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/youth-cap"
          mkdir -p "$out"
          cd "$out"
          find . -type f -name '*.png' -print0 | sort -z | xargs -0 -r sha256sum > FRAME_SHA256.txt
          printf '%s\n' "$GITHUB_RUN_ID" > run-id.txt
      - name: Preserve reports and actual renders only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: youth-cap-binding-review-${{ github.run_id }}
          path: |
            artifacts/youth-cap/**/*.json
            artifacts/youth-cap/**/*.log
            artifacts/youth-cap/**/*.txt
            artifacts/youth-cap/**/*.png
          if-no-files-found: warn
          retention-days: 14
