name: Restore the verified original Blender source

on:
  push:
    branches: ['feature/village-life-delivery-20261123']
    paths: ['.github/workflows/source-recovery-20261123.yml']

permissions:
  contents: write

concurrency:
  group: source-recovery-20261123
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Restore byte-identical source from verified repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          parts = ['6490fbd0338e613277a3b4b736918f7fcb0f4315', '1ad57dbebe215fe772947092fb27c3330281ae68']
          chunks = []
          for sha in parts:
              request = urllib.request.Request(
                  'https://api.github.com/repos/Ullmann27/Imperathen/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  item = json.load(response)
              if item.get('sha') != sha or item.get('encoding') != 'base64':
                  raise SystemExit('Unexpected source blob response')
              chunk = base64.b64decode(item['content'])
              actual = hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest()
              if actual != sha:
                  raise SystemExit('Source chunk checksum mismatch')
              chunks.append(chunk)
          original = b''.join(chunks)
          expected = '75153c7f3922567fb2b03dcd1a6f3f179b6d95a07b7f77c9460940c4e0e6b826'
          if len(original) != 12983176 or hashlib.sha256(original).hexdigest() != expected:
              raise SystemExit('Original source checksum mismatch')
          target = pathlib.Path('art/frontier_people/elder.blend')
          if target.exists() and target.read_bytes() != original:
              raise SystemExit('Refusing to overwrite a different source')
          target.write_bytes(original)
          print('Verified original elder.blend:', len(original), 'bytes, SHA-256', expected)
          PY
      - name: Save the restored source on the same delivery branch
        run: |
          set -euo pipefail
          git add -- art/frontier_people/elder.blend
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore byte-identical original elder Blender source'
          git push origin HEAD:feature/village-life-delivery-20261123
