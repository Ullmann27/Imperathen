name: IMPERATHEN isolated installable ARM64 QA – NOT a release
on:
  push:
    branches: ['feature/fold7-qa-installable-not-release-20261125']
  pull_request:
    paths:
      - 'tools/build_unreleased_city_qa.py'
      - '.github/workflows/fold7-unreleased-qa.yml'
      - 'prototype/**'

permissions:
  contents: read

concurrency:
  group: unreleased-city-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-independent-arm64-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record exact source commit and intentionally withheld release status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa artifacts/qa/engine prototype/assets/world
          git rev-parse HEAD > artifacts/qa/SOURCE_COMMIT.txt
          printf '%s\n' "UNRELEASED QA. Original motion quality gate remains blocked." > artifacts/qa/RELEASE_BLOCKED.txt
          python3 -m unittest discover -s tests -p 'android_package_isolation_test.py' -v
          python3 -m unittest discover -s tests -p 'android_*_test.py' -v
      - name: Install official Blender, Python and SDK build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender -b --python-expr "import numpy;print('NUMPY_BLENDER_AVAILABLE',numpy.__version__)"
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.1/apksigner" || ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1' 'platforms;android-35'
          fi
      - name: Produce actual original city and separate physical collision GLBs
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 1 --python tools/world/build_roman_test_city.py -- \
            --output "$RUNNER_TEMP/city" --surface-style viva --texture-size 1024 \
            > artifacts/qa/roman-city-blender.log 2>&1
          grep -q CITY_BUILD_COMPLETE artifacts/qa/roman-city-blender.log
          cp "$RUNNER_TEMP/city/imperathen_roman_test_city.glb" prototype/assets/world/roman_city_test.glb
          cp "$RUNNER_TEMP/city/roman_city_collision.glb" prototype/assets/world/roman_city_collision.glb
          cp "$RUNNER_TEMP/city/city_manifest.json" prototype/assets/world/roman_city_manifest.json
          python3 tools/world/check_city_release_assets.py --prototype prototype \
            --output artifacts/qa/asset-audit.json
      - name: Stage the user's original Meshy boy only from a private verified source
        shell: bash
        env:
          PRIVATE_MESHY_YOUTH_GLB_URL: ${{ secrets.IMPERATHEN_PRIVATE_MESHY_YOUTH_GLB_URL }}
        run: |
          set -euo pipefail
          # Never write the short-lived signed URL, its query, or the unmodified
          # user-owned Meshy source file to public git history or QA artifacts.
          if [[ -z "${PRIVATE_MESHY_YOUTH_GLB_URL:-}" ]]; then
            printf '%s\n' '{"status":"NOT_STAGED","task_id":"b6856033-bc9f-44fe-af12-e9843f161aed","original_youth_active":false,"reason":"Private Meshy source URL secret not supplied"}' \
              > artifacts/qa/original-youth-status.json
            echo "::error::Original Meshy youth missing. This user-requested FIRST PLAY APK must not ship with a replacement boy."
            exit 1
          else
            if [[ "$PRIVATE_MESHY_YOUTH_GLB_URL" != *"b6856033-bc9f-44fe-af12-e9843f161aed"* ]]; then
              echo "::error::Private Meshy model URL does not name the user-confirmed source task."
              exit 1
            fi
            SOURCE="$RUNNER_TEMP/imperathen-original-meshy-youth.glb"
            curl --fail --location --silent --show-error --retry 3 \
              --output "$SOURCE" "$PRIVATE_MESHY_YOUTH_GLB_URL"
            test -s "$SOURCE"
            # The Blender script is specifically authored for this exact
            # texturised Meshy task and fails closed on unexpected sword/skin
            # topology. Never substitute a generic or concept-board child.
            # The city generator works with distro Blender, but the reviewed
            # source-specific character rigger requires Blender 4.3.2+.
            BLENDER_BASE="https://download.blender.org/release/Blender4.3"
            BLENDER_NAME="blender-4.3.2-linux-x64.tar.xz"
            curl --fail --location --retry 3 --silent --show-error \
              "$BLENDER_BASE/$BLENDER_NAME" -o "$RUNNER_TEMP/$BLENDER_NAME"
            curl --fail --location --retry 3 --silent --show-error \
              "$BLENDER_BASE/blender-4.3.2.sha256" -o "$RUNNER_TEMP/blender-4.3.2.sha256"
            python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,re
          root=Path(os.environ['RUNNER_TEMP'])
          name='blender-4.3.2-linux-x64.tar.xz'
          lines=[line for line in (root/'blender-4.3.2.sha256').read_text().splitlines() if name in line]
          if len(lines)!=1:raise SystemExit('Pinned Blender checksum entry missing/ambiguous')
          matches=re.findall(r'(?i)\b[a-f0-9]{64}\b',lines[0])
          if len(matches)!=1:raise SystemExit('Pinned Blender SHA-256 malformed')
          actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
          if actual.lower()!=matches[0].lower():raise SystemExit('Official Blender SHA-256 mismatch')
          PY
            tar -xJf "$RUNNER_TEMP/$BLENDER_NAME" -C "$RUNNER_TEMP"
            BLENDER_432="$RUNNER_TEMP/blender-4.3.2-linux-x64/blender"
            "$BLENDER_432" -b --python-expr "import bpy;assert bpy.app.version >= (4,3,2)"
            "$BLENDER_432" -b -t 2 --python-exit-code 1 \
              --python tools/characters/build_meshy_player.py -- \
              --source "$SOURCE" > artifacts/qa/mesh-original-youth-build.log 2>&1
            grep -q YOUTH_BUILT artifacts/qa/mesh-original-youth-build.log
            PYTHONPATH=tools/art python3 - <<'PY'
          import json
          from pathlib import Path
          from inspect_meshy_glb import inspect_glb
          paths = [Path(f'prototype/assets/characters/hero_meshy_italia_{i}.glb') for i in range(4)]
          reports = [inspect_glb(p) for p in paths]
          for i, report in enumerate(reports):
              if not report.get('character_rig_gate'):
                  raise SystemExit(f'Hero LOD {i} failed rig+skin+animation gate')
          receipt = json.loads(Path('docs/28_city_sandbox/youth-build.json').read_text())
          if receipt.get('task_id') != 'b6856033-bc9f-44fe-af12-e9843f161aed':
              raise SystemExit('Original Meshy youth task does not match the confirmed user identity')
          if receipt.get('sword_mesh_name') != 'PracticeBlade' or not receipt.get('sword_hidden_until_adult_equipment_authorization'):
              raise SystemExit('Child weapon visibility contract failed: source sword must be an authorized removable prop')
          output = {'status':'STAGED_QA_ONLY','task_id':receipt['task_id'],
                    'original_youth_active_in_source':True,'source_sha256':receipt['source_sha256'],
                    'lods':receipt['lods'],'limits':receipt.get('limits',[])}
          Path('artifacts/qa/original-youth-status.json').write_text(json.dumps(output,indent=2))
          PY
          fi
      - name: Download matching Godot and Android templates with SHA512 verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          home=pathlib.Path(os.environ["RUNNER_TEMP"])/"godot"
          known={s.split()[-1].lstrip('*'):s.split()[0] for s in (home/"SHA512-SUMS.txt").read_text().splitlines() if s.strip()}
          for local,remote in [('godot.zip','Godot_v4.7.2-stable_linux.x86_64.zip'),
                               ('templates.tpz','Godot_v4.7.2-stable_export_templates.tpz')]:
              with (home/local).open('rb') as f: actual=hashlib.file_digest(f,'sha512').hexdigest()
              if actual!=known.get(remote):raise SystemExit('Official template SHA512 mismatch: '+remote)
          with zipfile.ZipFile(home/'godot.zip') as z:z.extractall(home)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'templates/4.7.2.stable'
          with zipfile.ZipFile(home/'templates.tpz') as z:
              for name in ('android_debug.apk','android_release.apk','version.txt'):
                  (target/name).write_bytes(z.read('templates/'+name))
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "TEMPLATE_DIR=$RUNNER_TEMP/templates/4.7.2.stable" >> "$GITHUB_ENV"
      - name: Reject broken app functionality but keep separate release-motion finding
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going \
            --only import roman_menu city_trade city_market_bridge city_inventory_ui \
              city_support city_viva_props city_exploration_detail npc_physical_conversation \
              touch_controls fold7_graphics_policy main_scene \
            --report artifacts/qa/engine
          "$GODOT_BIN" --headless --path prototype --script res://tests/roman_city_real_asset_test.gd \
            2>&1 | tee artifacts/qa/real-city-import.log
          grep -q ROMAN_CITY_REAL_ASSET_PASS artifacts/qa/real-city-import.log
          IMPERATHEN_REQUIRE_ORIGINAL_YOUTH=1 "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
            --script res://tests/roman_city_real_walk_test.gd \
            2>&1 | tee artifacts/qa/real-city-walk.log
          grep -q ROMAN_CITY_REAL_WALK_PASS artifacts/qa/real-city-walk.log
          grep -Eq '"original_youth_active":true' artifacts/qa/real-city-walk.log
          echo "IMPERATHEN_FIRST_PLAY_ORIGINAL_BOY_LOADED: matching Meshy youth used in a real Godot city session"
          "$GODOT_BIN" --headless --path prototype --script res://tests/city_crowd_layout_test.gd \
            2>&1 | tee artifacts/qa/crowd-layout.log
          grep -q CITY_CROWD_LAYOUT_PASS artifacts/qa/crowd-layout.log
      - name: Create separate ephemeral QA signing key (NOT existing app certificate)
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/imperathen-qa-ephemeral.jks" \
            -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -alias imperathen-qa -keyalg RSA -keysize 3072 -validity 365 \
            -dname 'CN=IMPERATHEN separate QA app, O=IMPERATHEN, C=AT'
      - name: Export, sign and independently validate safe ARM64 QA package
        shell: bash
        run: |
          set -euo pipefail
          APK="IMPERATHEN-UNRELEASED-QA-${GITHUB_SHA:0:8}-arm64.apk"
          python3 tools/build_unreleased_city_qa.py \
            --godot "$GODOT_BIN" --sdk-root "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" --template-dir "$TEMPLATE_DIR" \
            --keystore "$RUNNER_TEMP/imperathen-qa-ephemeral.jks" \
            --keystore-user imperathen-qa --timeout 900 \
            --output "artifacts/qa/$APK"
          test -s "artifacts/qa/$APK"
          sha256sum "artifacts/qa/$APK" > artifacts/qa/QA_SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs \
            "artifacts/qa/$APK" > artifacts/qa/qa-signing-certificate.txt
          printf '%s\n' "APK is at.heinz.imperathen.qa; this does NOT update the original app." \
            > artifacts/qa/INSTALLATION-NOTE.txt
      - name: Preserve generated test package, proof and error logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-unreleased-qa-arm64-${{ github.run_number }}
          path: artifacts/qa/
          if-no-files-found: warn
          retention-days: 30
