name: IMPERATHEN isolated installable ARM64 QA – NOT a release
on:
  push:
    branches: ['feature/fold7-qa-installable-not-release-20261125', 'fix/hero-identity-city-motion-20261125', 'build/imperathen-integrated-arm64-qa-20261126', 'feat/marcus-authored-character-20261126', 'fix/android-vegetation-render-20261126', 'fix/fold7-device-visual-gameplay-recovery-20261126']
  pull_request:
    paths:
      - 'tools/build_unreleased_city_qa.py'
      - 'tools/characters/youth_skin_polish.py'
      - 'tools/characters/youth_anatomy.py'
      - 'tools/characters/retarget_accad_youth.py'
      - 'tools/characters/stage_youth_civil.py'
      - 'tools/characters/build_youth_civil_outfit.py'
      - 'tools/characters/clear_youth_civil_arms.py'
      - '.github/workflows/fold7-unreleased-qa.yml'
      - 'prototype/**'

permissions:
  contents: write

concurrency:
  group: unreleased-city-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.head_ref != 'integration/imperathen-unified-20261125' }}

jobs:
  signed-independent-arm64-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record exact source commit and intentionally withheld release status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa artifacts/qa/engine prototype/assets/world
          git rev-parse HEAD > artifacts/qa/SOURCE_COMMIT.txt
          printf '%s\n' "UNRELEASED QA. Original motion quality gate remains blocked." > artifacts/qa/RELEASE_BLOCKED.txt
          python3 -m unittest discover -s tests -p 'android_package_isolation_test.py' -v
          python3 -m unittest discover -s tests -p 'android_*_test.py' -v
      - name: Install official Blender, Python and SDK build requirements
        shell: bash
        run: |
          set -euo pipefail
          # Bound network hangs without killing a healthy but slow package download.
          timeout 300s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q
          timeout 900s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends blender python3-numpy python3-scipy python3-pil
          blender -b --python-expr "import numpy;print('NUMPY_BLENDER_AVAILABLE',numpy.__version__)"
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.1/apksigner" || ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1' 'platforms;android-35'
          fi
      - name: Recover existing Meshy assets for the review catalog (read only)
        env:
          MESHY_API_KEY: ${{ secrets.IMPERATHEN_MESHY_API_KEY || secrets.MESHY_API_KEY }}
        run: |
          python3 tools/art/recover_meshy_sources.py --report artifacts/qa/meshy-recovery.json
      - name: Produce actual original city and separate physical collision GLBs
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 1 --python tools/world/build_roman_test_city.py -- \
            --output "$RUNNER_TEMP/city" --surface-style viva --texture-size 1024 \
            > artifacts/qa/roman-city-blender.log 2>&1
          grep -q CITY_BUILD_COMPLETE artifacts/qa/roman-city-blender.log
          cp "$RUNNER_TEMP/city/imperathen_roman_test_city.glb" prototype/assets/world/roman_city_test.glb
          cp "$RUNNER_TEMP/city/roman_city_collision.glb" prototype/assets/world/roman_city_collision.glb
          cp "$RUNNER_TEMP/city/city_manifest.json" prototype/assets/world/roman_city_manifest.json
          python3 tools/world/check_city_release_assets.py --prototype prototype \
            --output artifacts/qa/asset-audit.json
      - name: Import the user's already rigged original boy without new secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/characters/stage_original_youth.py \
            --archive "$RUNNER_TEMP/imperathen-original-youth-runtime.zip" \
            --report artifacts/qa/original-youth-status.json
          test -s prototype/assets/characters/hero_meshy_italia_0.glb
      - name: Retarget recorded human walk run and unarmed combat onto the exact original youth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/youth-mocap"
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://accad.ohio-state.edu/sites/accad.osu.edu/files/Male2_bvh.zip' -o "$RUNNER_TEMP/accad-male2.zip"
          # The story explicitly requests the original youth in civilian clothing.
          # Build that private derivative from the pristine sources BEFORE the
          # armoured retarget overwrites them. Never commit private GLBs.
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/stage_youth_civil.py \
            --source prototype/assets/characters --accad-archive "$RUNNER_TEMP/accad-male2.zip" \
            --work "$RUNNER_TEMP/youth-civil"
          for lod in 0 1 2 3; do test -s "prototype/assets/characters/hero_meshy_italia_civil_$lod.glb"; done
          test -s prototype/assets/animations/accad_youth_civil_motion.json
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/retarget_accad_youth.py \
            --archive "$RUNNER_TEMP/accad-male2.zip" --input prototype/assets/characters \
            --output "$RUNNER_TEMP/youth-mocap" --report artifacts/qa/youth-mocap-report.json
          cp "$RUNNER_TEMP"/youth-mocap/hero_meshy_italia_*.glb prototype/assets/characters/
          cp artifacts/qa/youth-mocap-report.json prototype/assets/animations/accad_youth_motion.json
      - name: Download matching Godot and Android templates with SHA512 verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          home=pathlib.Path(os.environ["RUNNER_TEMP"])/"godot"
          known={s.split()[-1].lstrip('*'):s.split()[0] for s in (home/"SHA512-SUMS.txt").read_text().splitlines() if s.strip()}
          for local,remote in [('godot.zip','Godot_v4.7.2-stable_linux.x86_64.zip'),
                               ('templates.tpz','Godot_v4.7.2-stable_export_templates.tpz')]:
              with (home/local).open('rb') as f: actual=hashlib.file_digest(f,'sha512').hexdigest()
              if actual!=known.get(remote):raise SystemExit('Official template SHA512 mismatch: '+remote)
          with zipfile.ZipFile(home/'godot.zip') as z:z.extractall(home)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'templates/4.7.2.stable'
          with zipfile.ZipFile(home/'templates.tpz') as z:
              for name in ('android_debug.apk','android_release.apk','version.txt'):
                  (target/name).write_bytes(z.read('templates/'+name))
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "TEMPLATE_DIR=$RUNNER_TEMP/templates/4.7.2.stable" >> "$GITHUB_ENV"
      - name: Build the distinct authored Marcus family
        shell: bash
        run: |
          set -euo pipefail
          bash tools/characters/install_marcus_blender.sh "$RUNNER_TEMP/marcus-blender"
          "$RUNNER_TEMP/marcus-blender/blender" -b -t 2 --python-exit-code 1 -P tools/characters/build_marcus.py -- --evidence artifacts/marcus
          python3 tools/characters/validate_hero.py prototype/assets/characters/marcus_quality_{0,1,2,3}.glb --report artifacts/marcus/validation.json
          echo "IMPERATHEN_REQUIRE_MARCUS=1" >> "$GITHUB_ENV"
      - name: Complete native vegetation meshes and distance impostors
        shell: bash
        run: bash tools/integration/prepare_vegetation_assets.sh
      - name: Reconcile three measured kick tracks before functional gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rebake_melee_kicks.py --godot "$GODOT_BIN" --report artifacts/kick-rebake --apply
      - name: Reject broken app functionality but keep separate release-motion finding
        shell: bash
        run: |
          set -euo pipefail
          IMPERATHEN_FULL_ASSET_ACCEPTANCE=1 python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going \
            --only import route_fire meshy_asset_registry vegetation vegetation_safe valdora_house_family village_landscape opening_flow opening_voice i01_flow roman_menu city_trade city_market_bridge city_inventory_ui \
              city_support city_viva_props city_exploration_detail npc_physical_conversation city_watch i03_flow \
              touch_controls fold7_graphics_policy main_scene \
              combat_actions melee_tracks melee_core melee_visual_contact melee_feedback melee_camera melee_weapons \
              frontier_people resident_catalog_bridge marcus_character village_childhood i01_slice i03_slice i04_slice mission_bridge_data band1_expansion companion_turn_motion \
            --report artifacts/qa/engine
          "$GODOT_BIN" --headless --path prototype --script res://tests/roman_city_real_asset_test.gd \
            2>&1 | tee artifacts/qa/real-city-import.log
          grep -q ROMAN_CITY_REAL_ASSET_PASS artifacts/qa/real-city-import.log
          IMPERATHEN_REQUIRE_ORIGINAL_YOUTH=1 "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
            --script res://tests/roman_city_real_walk_test.gd \
            2>&1 | tee artifacts/qa/real-city-walk.log
          grep -q ROMAN_CITY_REAL_WALK_PASS artifacts/qa/real-city-walk.log
          grep -Eq '"original_youth_active":true' artifacts/qa/real-city-walk.log
          echo "IMPERATHEN_FIRST_PLAY_ORIGINAL_BOY_LOADED: matching Meshy youth used in a real Godot city session"
          "$GODOT_BIN" --headless --path prototype --script res://tests/city_crowd_layout_test.gd \
            2>&1 | tee artifacts/qa/crowd-layout.log
          grep -q CITY_CROWD_LAYOUT_PASS artifacts/qa/crowd-layout.log
          "$GODOT_BIN" --headless --path prototype --script res://tests/city_training_test.gd 2>&1 | tee artifacts/qa/city-training.log
          grep -q CITY_TRAINING_PASS artifacts/qa/city-training.log
          "$GODOT_BIN" --headless --path prototype --script res://tests/mission_cinematics_test.gd 2>&1 | tee artifacts/qa/mission-cinematics.log
          grep -q MISSION_CINEMATICS_PASS artifacts/qa/mission-cinematics.log
          "$GODOT_BIN" --headless --path prototype --script res://tests/youth_mocap_test.gd 2>&1 | tee artifacts/qa/youth-mocap-runtime.log
          grep -q YOUTH_MOCAP_RUNTIME_PASS artifacts/qa/youth-mocap-runtime.log
      - name: Verify Android-safe vegetation in a real Compatibility framebuffer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          bash tools/integration/check_vegetation_safe_render.sh "$GODOT_BIN" artifacts/qa/vegetation-render
      - name: Create separate ephemeral QA signing key (NOT existing app certificate)
        shell: bash
        run: |
          set -euo pipefail
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/imperathen-qa-ephemeral.jks" \
            -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -alias imperathen-qa -keyalg RSA -keysize 3072 -validity 365 \
            -dname 'CN=IMPERATHEN separate QA app, O=IMPERATHEN, C=AT'
      - name: Export, sign and independently validate safe ARM64 QA package
        shell: bash
        run: |
          set -euo pipefail
          APK="IMPERATHEN-UNRELEASED-QA-${GITHUB_SHA:0:8}-arm64.apk"
          python3 tools/build_unreleased_city_qa.py \
            --godot "$GODOT_BIN" --sdk-root "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" --template-dir "$TEMPLATE_DIR" \
            --keystore "$RUNNER_TEMP/imperathen-qa-ephemeral.jks" \
            --keystore-user imperathen-qa --timeout 900 \
            --output "artifacts/qa/$APK"
          test -s "artifacts/qa/$APK"
          sha256sum "artifacts/qa/$APK" > artifacts/qa/QA_SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs \
            "artifacts/qa/$APK" > artifacts/qa/qa-signing-certificate.txt
          printf '%s\n' "APK is at.heinz.imperathen.qa; this does NOT update the original app." \
            > artifacts/qa/INSTALLATION-NOTE.txt
      - name: Publish validated installable FIRST PLAY APK as an ordinary direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/hero-identity-city-motion-20261125'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="artifacts/qa/IMPERATHEN-UNRELEASED-QA-${GITHUB_SHA:0:8}-arm64.apk"
          TAG="first-play-qa-${GITHUB_SHA:0:8}"
          test -s "$APK"
          grep -q STAGED_VERIFIED_RUNTIME artifacts/qa/original-youth-status.json
          grep -q YOUTH_MOCAP_RUNTIME_PASS artifacts/qa/youth-mocap-runtime.log
          grep -Eq '"original_youth_active":true' artifacts/qa/real-city-walk.log
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" artifacts/qa/QA_SHA256SUMS.txt artifacts/qa/original-youth-status.json artifacts/qa/youth-mocap-report.json --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "IMPERATHEN FIRST PLAY – Originalfigur · Android QA" \
              --notes "Separately signed ARM64 QA with the original 35-joint Meshy youth and 11 retargeted human motion clips (walk, run, six punches, two kicks and guard). Open Motion Project by ACCAD/The Ohio State University, CC BY 3.0; adapted by IMPERATHEN. https://accad.ohio-state.edu/research/motion-lab/mocap-system-and-data ; https://creativecommons.org/licenses/by/3.0/ . Not a production-signature update; full visual motion and physical Fold7 acceptance remain open." \
              "$APK" artifacts/qa/QA_SHA256SUMS.txt artifacts/qa/original-youth-status.json artifacts/qa/youth-mocap-report.json
          fi
      - name: Preserve generated test package, proof and error logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-unreleased-qa-arm64-${{ github.run_number }}
          path: |
            artifacts/qa/
            artifacts/marcus/
            artifacts/kick-rebake/
          if-no-files-found: warn
          retention-days: 30
