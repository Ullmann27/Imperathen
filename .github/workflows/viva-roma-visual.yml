name: VIVA ROMA surface and atmosphere checks
on:
  pull_request:
    paths:
      - 'tools/world/viva_roma_surfaces.py'
      - 'tools/world/check_viva_roma_surfaces.py'
      - 'tools/world/build_roman_test_city.py'
      - 'prototype/scripts/rendering/viva_roma_atmosphere.gd'
      - 'prototype/shaders/viva_roma_ground.gdshader'
      - 'prototype/scripts/world/city_exploration.gd'
      - 'prototype/tests/viva_roma_atmosphere_test.gd'
      - '.github/workflows/viva-roma-visual.yml'
permissions:
  contents: read
jobs:
  surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Numerical PBR checks
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/viva"
          "$RUNNER_TEMP/viva/bin/pip" install numpy==2.2.6
          "$RUNNER_TEMP/viva/bin/python" -m py_compile tools/world/build_roman_test_city.py
          "$RUNNER_TEMP/viva/bin/python" tools/world/check_viva_roma_surfaces.py
  atmosphere:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Get verified Godot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"; cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$release/$archive" -o "$archive"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          p=pathlib.Path("Godot_v4.7.2-stable_linux.x86_64.zip")
          sums={s.split()[-1].lstrip("*"):s.split()[0] for s in pathlib.Path("SHA512-SUMS.txt").read_text().splitlines() if s.strip()}
          with p.open("rb") as f:
              assert hashlib.file_digest(f,"sha512").hexdigest()==sums[p.name]
          with zipfile.ZipFile(p) as z: z.extractall()
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Isolated engine checks, full city import not claimed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/viva_fixture/scripts/rendering" "$RUNNER_TEMP/viva_fixture/shaders" "$RUNNER_TEMP/viva_fixture/tests"
          cp prototype/scripts/rendering/viva_roma_atmosphere.gd "$RUNNER_TEMP/viva_fixture/scripts/rendering/"
          cp prototype/shaders/viva_roma_ground.gdshader "$RUNNER_TEMP/viva_fixture/shaders/"
          cp prototype/tests/viva_roma_atmosphere_test.gd "$RUNNER_TEMP/viva_fixture/tests/"
          printf '[application]\nconfig/name="VIVA Fixture"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$RUNNER_TEMP/viva_fixture/project.godot"
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/viva_fixture" --import --quit
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/viva_fixture" --script res://tests/viva_roma_atmosphere_test.gd 2>&1 | tee "$RUNNER_TEMP/viva.log"
          grep -q VIVA_ROMA_ATMOSPHERE_PASS "$RUNNER_TEMP/viva.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$RUNNER_TEMP/viva.log"; then exit 1; fi
