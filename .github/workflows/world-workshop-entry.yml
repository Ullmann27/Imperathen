name: IMPERATHEN World Workshop runtime entry
on:
  push:
    branches: ['feature/astra-sol-workshop-runtime-entry-20261128']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/workshop-entry
          git rev-parse HEAD > artifacts/workshop-entry/source.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Architecture and actual workshop entry regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/architecture/test_index.mjs
          node tools/architecture/build_index.mjs --check
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --only import roman_menu world_workshop_entry world_expansion --keep-going --report artifacts/workshop-entry/engine
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("artifacts/workshop-entry/engine/world_expansion.log")
          line=next(l for l in p.read_text().splitlines() if l.startswith("WORLD_EXPANSION_TESTS "))
          row=json.loads(line.split(" ",1)[1])
          assert row["passed"] and row["asset_import"]["checked"] and row["asset_import"]["passed"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: imperathen-workshop-entry-${{ github.run_id }}
          path: artifacts/workshop-entry/
          retention-days: 14
