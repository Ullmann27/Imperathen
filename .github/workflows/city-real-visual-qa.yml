name: Genuine Roman forum before and after visual review
on:
  push:
    branches: ['fix/roman-city-real-visuals-20261125']
  pull_request:
    paths:
      - 'tools/world/build_roman_test_city.py'
      - 'prototype/scripts/rendering/viva_roma_atmosphere.gd'
      - '.github/workflows/city-real-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: actual-roman-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-framebuffer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install real Blender and OpenGL software display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends blender python3-numpy xvfb xauth libgl1-mesa-dri
          blender -b --python-expr "import numpy; print('BLENDER_IMPORT_READY',numpy.__version__)"
      - name: Rebuild real edited RomanCity and its matching collision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-visual prototype/assets/world
          blender -b -t 2 --python-exit-code 1 --python tools/world/build_roman_test_city.py -- \
            --output "$RUNNER_TEMP/visual-roman" --surface-style viva --texture-size 1024 \
            2>&1 | tee artifacts/real-visual/blender.log
          grep -q CITY_BUILD_COMPLETE artifacts/real-visual/blender.log
          cp "$RUNNER_TEMP/visual-roman/imperathen_roman_test_city.glb" prototype/assets/world/roman_city_test.glb
          cp "$RUNNER_TEMP/visual-roman/roman_city_collision.glb" prototype/assets/world/roman_city_collision.glb
          cp "$RUNNER_TEMP/visual-roman/city_manifest.json" prototype/assets/world/roman_city_manifest.json
      - name: Install official SHA512-verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          python3 - <<'PY'
          import pathlib,hashlib,zipfile
          f=pathlib.Path("Godot_v4.7.2-stable_linux.x86_64.zip")
          digests={s.split()[-1].lstrip('*'):s.split()[0] for s in pathlib.Path('SHA512-SUMS.txt').read_text().splitlines() if s.strip()}
          with f.open('rb') as stream:
              assert hashlib.file_digest(stream,'sha512').hexdigest() == digests[f.name]
          with zipfile.ZipFile(f) as archive: archive.extractall()
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and capture exact fixed High/Very High viewpoints
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 \
            | tee artifacts/real-visual/import.log
          for profile in high very_high; do
            export IMPERATHEN_CITY_RENDER_PROFILE="$profile"
            export IMPERATHEN_CITY_RENDER_OUTPUT="$GITHUB_WORKSPACE/artifacts/real-visual"
            xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" \
              --path prototype --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 \
              --script res://tests/roman_city_visual_capture.gd \
              2>&1 | tee "artifacts/real-visual/$profile.log"
            grep -q ROMAN_CITY_VISUAL_PASS "artifacts/real-visual/$profile.log"
            # Known Mesa software-OpenGL shutdown cleanup warnings are kept as
            # a separate finding. Never permit unrelated script/render errors.
            grep -E '^ERROR: Texture with GL ID of [0-9]+: leaked [0-9]+ bytes\.$' \
              "artifacts/real-visual/$profile.log" >> artifacts/real-visual/cleanup-warnings.log || true
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "artifacts/real-visual/$profile.log" \
              | grep -Ev '^ERROR: Texture with GL ID of [0-9]+: leaked [0-9]+ bytes\.$'; then
              echo "Unexpected actual Godot graphics error" >&2
              exit 1
            fi
          done
      - name: Preserve unretouched GL framebuffer images and warnings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-real-visual-facade-${{ github.run_number }}
          path: artifacts/real-visual/
          if-no-files-found: warn
          retention-days: 30
