name: Visual asset contract

on:
  pull_request:
    paths:
      - 'art/visual_benchmark/**'
      - 'tools/art/**'
      - '.github/workflows/visual-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-glb-contract:
    name: Seven GLB assets (static contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate embedded models and materials
        run: python3 tools/art/run_visual_pipeline.py --assets-only
