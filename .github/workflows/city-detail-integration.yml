name: Combined Roman city visual details and ambient residents

on:
  push:
    branches: ['integration/city-visuals-npc-details-20261125']
  pull_request:
    paths:
      - 'prototype/scripts/world/city_exploration.gd'
      - 'prototype/scripts/world/city_ambient_people.gd'
      - 'prototype/scripts/rendering/city_surface_microdetail.gd'
      - 'prototype/tests/city_ambient_people_test.gd'
      - 'prototype/tests/city_surface_microdetail_test.gd'
      - '.github/workflows/city-detail-integration.yml'

permissions:
  contents: read

concurrency:
  group: roman-city-detail-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-city-detail-systems:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Godot official SHA512
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$release/$archive" -o "$archive"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path.cwd()
          filename='Godot_v4.7.2-stable_linux.x86_64.zip'
          hashes={line.split()[-1].lstrip('*'):line.split()[0] for line in (root/'SHA512-SUMS.txt').read_text().splitlines() if line.strip()}
          with (root/filename).open('rb') as binary:
              actual=hashlib.file_digest(binary,'sha512').hexdigest()
          if actual!=hashes.get(filename):
              raise SystemExit('Official Godot archive checksum does not match')
          with zipfile.ZipFile(root/filename) as zipped:
              zipped.extractall(root)
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Validate exact city layout and import GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p city-integration-evidence
          python3 tools/city_detail/check_market_anchors.py 2>&1 | tee city-integration-evidence/anchors.log
          "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee city-integration-evidence/import.log
      - name: Verify live walking and real conversation geometry
        shell: bash
        run: |
          set -euo pipefail
          IMPERATHEN_ISOLATED_TEST=1 "$GODOT_BIN" --headless --path prototype \
            --fixed-fps 60 --script res://tests/city_ambient_people_test.gd 2>&1 | tee city-integration-evidence/people.log
          grep -q 'CITY_AMBIENT_PEOPLE_PASS' city-integration-evidence/people.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' city-integration-evidence/people.log; then exit 1; fi
          IMPERATHEN_ISOLATED_TEST=1 "$GODOT_BIN" --headless --path prototype \
            --fixed-fps 60 --script res://tests/city_market_signage_test.gd 2>&1 | tee city-integration-evidence/shops.log
          grep -q 'CITY_MARKET_SIGNAGE_PASS' city-integration-evidence/shops.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' city-integration-evidence/shops.log; then exit 1; fi
          IMPERATHEN_ISOLATED_TEST=1 "$GODOT_BIN" --headless --path prototype \
            --fixed-fps 60 --script res://tests/city_exploration_detail_adapter_test.gd 2>&1 | tee city-integration-evidence/paving.log
          grep -q 'CITY_EXPLORATION_DETAIL_PASS' city-integration-evidence/paving.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' city-integration-evidence/paving.log; then exit 1; fi
      - name: Verify facade materials through actual OpenGL context
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y xvfb xauth
          fi
          IMPERATHEN_ISOLATED_TEST=1 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" \
            --path prototype --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 60 \
            --script res://tests/city_surface_microdetail_test.gd 2>&1 | tee city-integration-evidence/facades.log
          grep -q 'CITY_SURFACE_MICRODETAIL_PASS' city-integration-evidence/facades.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' city-integration-evidence/facades.log; then exit 1; fi
      - name: Keep real logs and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-full-city-detail-${{ github.run_number }}
          path: city-integration-evidence/
          if-no-files-found: warn
          retention-days: 14
