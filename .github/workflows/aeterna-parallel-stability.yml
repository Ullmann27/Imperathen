name: AETERNA parallel stability - source-bound evidence
on:
  push:
    branches: ['fix/aeterna-parallel-stability-20261127']
permissions:
  contents: read
jobs:
  focused:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: night-light-protocol
            checks: import render_bench_views village_look
          - lane: weather-and-landscape
            checks: import village_scenery
          - lane: formation-motion-60-180
            checks: import formation_agents formation_levels
          - lane: original-character-and-equipment
            checks: import resident_catalog_bridge soldier_visuals meshy_registry meshy_characters meshy_equipment troop_catalog
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "artifacts/${{ matrix.lane }}"
          git rev-parse HEAD > "artifacts/${{ matrix.lane }}/source.txt"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Verify the exact original atelier GLB source blobs
        if: matrix.lane == 'original-character-and-equipment'
        shell: bash
        run: |
          set -euo pipefail
          woman=prototype/assets/characters/frontier_civilian_woman_0.glb
          legion=prototype/assets/characters/frontier_legionary_0.glb
          test "$(git hash-object "$woman")" = 832153a77e6141b108a9370ef648e5a048e08368
          test "$(git hash-object "$legion")" = a40e2a1e710dfb809fbecb48b77c640dcdfec6e7
          sha256sum "$woman" "$legion" > artifacts/original-character-and-equipment/atelier-sha256.txt
      - name: Execute original strict engine groups plus added provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --only ${{ matrix.checks }} --report "artifacts/${{ matrix.lane }}"
      - name: Capture actual night and day Compatibility frames independently of protocol result
        if: always() && matrix.lane == 'night-light-protocol'
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GODOT_BIN"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          state="$(mktemp -d "$RUNNER_TEMP/night-render.XXXXXX")"
          mkdir -p "$state"/{data,config,cache} "$PWD/artifacts/night-light-protocol/frames"
          export XDG_DATA_HOME="$state/data" XDG_CONFIG_HOME="$state/config" XDG_CACHE_HOME="$state/cache"
          export IMPERATHEN_SOURCE_COMMIT="$(git rev-parse HEAD)" LIBGL_ALWAYS_SOFTWARE=1
          timeout --kill-after=10s 600s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --resolution 1280x720 --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tests/render_comparison.gd ++ "$PWD/artifacts/night-light-protocol/frames" village aeterna low,balanced,high,very_high base 2 "" village_lane,night_torch 2>&1 | tee artifacts/night-light-protocol/framebuffer.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/night-light-protocol/framebuffer.log; then exit 1; fi
          python3 - <<'PY'
          import hashlib, json, pathlib, struct
          root = pathlib.Path("artifacts/night-light-protocol/frames")
          report = json.loads((root / "aeterna-report.json").read_text())
          assert report.get("complete") is True and not report.get("errors"), report.get("errors")
          frames = []
          for view in ("village_lane", "night_torch"):
              for profile in ("low", "balanced", "high", "very_high"):
                  path = root / f"aeterna-{view}-{profile}-base.png"
                  data = path.read_bytes()
                  assert data[:8] == b"\x89PNG\r\n\x1a\n" and data[12:16] == b"IHDR", path
                  width, height = struct.unpack(">II", data[16:24])
                  assert width > 0 and height > 0, path
                  frames.append({"file": path.name, "width": width, "height": height,
                                 "sha256": hashlib.sha256(data).hexdigest()})
          (root / "frame-receipt.json").write_text(json.dumps({"source_commit": report["source_commit"], "frames": frames, "device_acceptance": False}, indent=2) + "\n")
          PY
      - name: Retain separate evidence even when a strict gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-${{ matrix.lane }}-${{ github.run_id }}
          path: artifacts/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 30
