name: NVIDIA Nemotron engineering bridge
on:
  push:
    branches: ['feat/aeterna-nemotron-fold7-quality-20261127']
    paths:
      - 'tools/agent_bridge/**'
      - '.github/workflows/nemotron-engineering.yml'
permissions:
  contents: read
concurrency:
  group: imperathen-nemotron-engineering
  cancel-in-progress: false
jobs:
  consult:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test bridge validation and SSE parsing offline
        run: python3 -m unittest discover -s tools/agent_bridge -p 'test_*.py' -v
      - name: Ask NVIDIA Nemotron for implementation on pinned public source
        env:
          NVIDIA_API_KEY: ${{ secrets.IMPERATUM_NVIDIA }}
        run: python3 tools/agent_bridge/nemotron_bridge.py --request tools/agent_bridge/request.json --output artifacts/nemotron
      - name: Save unexecuted engineering answer and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nemotron-review-${{ github.run_id }}
          path: artifacts/nemotron/
          if-no-files-found: ignore
          retention-days: 14
