name: IMPERATHEN Fold7 candidate – real city, genuine APK, image checks

on:
  push:
    branches: ['integration/fold7-release-candidate-20261125', 'hoplite/*--stand-zero', 'integration/astra-sol-stand-zero-20261128', 'integration/astra-sol-complete-20261128', 'integration/astra-sol-apk-finalization-20261128', 'integration/astra-sol-apk-finalization-v2-20261128']
  pull_request:
    paths:
      - 'prototype/**'
      - 'tools/world/**'
      - 'tools/characters/stage_original_youth.py'
      - 'tools/characters/retarget_accad_youth.py'
      - 'tools/characters/stage_youth_civil.py'
      - 'tools/characters/build_youth_civil_outfit.py'
      - 'tools/characters/clear_youth_civil_arms.py'
      - 'tools/characters/youth_skin_polish.py'
      - 'tools/characters/youth_anatomy.py'
      - 'docs/28_city_sandbox/original-youth-runtime.json'
      - 'tools/build_android_prototype.py'
      - 'tools/check_prototype.py'
      - 'tests/android_package_isolation_test.py'
      - 'tests/roman_city_layout_test.py'
      - 'tests/city_collision_match_test.py'
      - '.github/workflows/fold7-city-apk.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: fold7-city-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.head_ref != 'integration/imperathen-unified-20261125' && !endsWith(github.ref, '--stand-zero') }}

jobs:
  real-city-arm64-qa-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PRIVATE_MESHY_TEMPLE_URL: ${{ secrets.IMPERATHEN_PRIVATE_MESHY_TEMPLE_URL }}
      UPDATE_KEYSTORE_B64: ${{ secrets.IMPERATHEN_UPDATE_KEYSTORE_B64 }}
      UPDATE_SIGNER_SHA256: ${{ secrets.IMPERATHEN_UPDATE_SIGNER_SHA256 }}
      UPDATE_KEY_ALIAS: ${{ secrets.IMPERATHEN_UPDATE_KEY_ALIAS }}
      UPDATE_KEY_PASSWORD: ${{ secrets.IMPERATHEN_UPDATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Document immutable source and run isolated QA package tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/city artifacts/mobile
          git rev-parse HEAD > artifacts/source-commit.txt
          python3 -m unittest discover -s tests -p 'android_package_isolation_test.py' -v
          python3 -m unittest discover -s tests -p 'android_*_test.py' -v
      - name: Install Blender and verified glTF dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-scipy python3-pil ffmpeg
          blender -b --python-expr "import numpy; print('BLENDER_NUMPY_OK',numpy.__version__)"
      - name: Recover existing Meshy assets for the review catalog (read only)
        env:
          MESHY_API_KEY: ${{ secrets.IMPERATHEN_MESHY_API_KEY || secrets.MESHY_API_KEY }}
        run: |
          python3 tools/art/recover_meshy_sources.py --report artifacts/city/meshy-recovery.json
      - name: Build original city, forum geometry and grounded NPC layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/city-export" prototype/assets/world
          # Blender-free layout regression of the same generator: closed wall
          # at every gate, no prop/tree inside buildings or on main streets,
          # unchanged market anchors, tiled ground surfaces, portico steps.
          python3 -m unittest tests/roman_city_layout_test.py -v 2>&1 | tee artifacts/city/layout-test.log
          blender -b -t 2 --python-exit-code 1 --python tools/world/build_roman_test_city.py -- \
            --output "$RUNNER_TEMP/city-export" --surface-style viva --texture-size 1024 \
            > artifacts/city/blender.log 2>&1
          grep -q CITY_BUILD_COMPLETE artifacts/city/blender.log
          cp "$RUNNER_TEMP/city-export/imperathen_roman_test_city.glb" prototype/assets/world/roman_city_test.glb
          cp "$RUNNER_TEMP/city-export/roman_city_collision.glb" prototype/assets/world/roman_city_collision.glb
          cp "$RUNNER_TEMP/city-export/city_manifest.json" prototype/assets/world/roman_city_manifest.json
          sha256sum prototype/assets/world/roman_city_test.glb prototype/assets/world/roman_city_collision.glb > artifacts/city/city-sha256.txt
          # Check actual exported geometry against its collision mesh.
          python3 tools/world/check_city_collision_match.py \
            --city prototype/assets/world/roman_city_test.glb \
            --collision prototype/assets/world/roman_city_collision.glb \
            --output artifacts/city/collision-match.json | tee artifacts/city/collision-match.log
          grep -q CITY_COLLISION_MATCH_PASS artifacts/city/collision-match.log
      - name: Import the original private Meshy temple if secure URL is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_MESHY_TEMPLE_URL" ]]; then
            echo "PRIVATE_TEMPLE_NOT_PRESENT: optional QA continues; full release stays blocked."
            exit 0
          fi
          # The signed download link is never recorded in git, stdout, or artifacts.
          umask 077
          curl --fail --silent --show-error --location --retry 2 "$PRIVATE_MESHY_TEMPLE_URL" \
            -o "$RUNNER_TEMP/original-private-temple.glb"
          blender -b -t 2 --python-exit-code 1 --python tools/world/prepare_private_temple.py -- \
            --input "$RUNNER_TEMP/original-private-temple.glb" \
            --output "$RUNNER_TEMP/private-temple" \
            > artifacts/city/temple-preparation.log 2>&1
          cp "$RUNNER_TEMP"/private-temple/roman_meshy_temple_*.glb prototype/assets/world/
          cp "$RUNNER_TEMP/private-temple/temple_review.json" prototype/assets/world/roman_temple_review.json
          echo "PRIVATE_TEMPLE_LODS_PRESENT: actual privately supplied model; measured bounds in temple_review.json"
      - name: Stage exact owner story models for Android QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/characters/stage_owner_runtime.py --archive "$RUNNER_TEMP/sextus-runtime.zip" --report artifacts/city/sextus-stage.json
          echo "IMPERATHEN_REQUIRE_SEXTUS=1" >> "$GITHUB_ENV"
          python3 tools/characters/stage_owner_runtime.py --family vibius --archive "$RUNNER_TEMP/vibius-runtime.zip" --report "artifacts/city/vibius-stage.json"
          echo "IMPERATHEN_REQUIRE_VIBIUS=1" >> "$GITHUB_ENV"
      - name: Import the user's already rigged original boy without new secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/characters/stage_original_youth.py \
            --archive "$RUNNER_TEMP/imperathen-original-youth-runtime.zip" \
            --report artifacts/city/original-youth-status.json
          test -s prototype/assets/characters/hero_meshy_italia_0.glb
      - name: Retarget recorded human walk run and unarmed combat onto the exact original youth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/youth-mocap"
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://accad.ohio-state.edu/sites/accad.osu.edu/files/Male2_bvh.zip' -o "$RUNNER_TEMP/accad-male2.zip"
          # The story explicitly requests the original youth in civilian clothing.
          # Build that private derivative from the pristine sources BEFORE the
          # armoured retarget overwrites them. Never commit private GLBs.
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/stage_youth_civil.py \
            --source prototype/assets/characters --accad-archive "$RUNNER_TEMP/accad-male2.zip" \
            --work "$RUNNER_TEMP/youth-civil"
          for lod in 0 1 2 3; do test -s "prototype/assets/characters/hero_meshy_italia_civil_$lod.glb"; done
          test -s prototype/assets/animations/accad_youth_civil_motion.json
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/retarget_accad_youth.py \
            --archive "$RUNNER_TEMP/accad-male2.zip" --input prototype/assets/characters \
            --output "$RUNNER_TEMP/youth-mocap" --report artifacts/city/youth-mocap-report.json
          cp "$RUNNER_TEMP"/youth-mocap/hero_meshy_italia_*.glb prototype/assets/characters/
          cp artifacts/city/youth-mocap-report.json prototype/assets/animations/accad_youth_motion.json
      - name: Static audit of exact Roman city asset bytes and private blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/world/check_city_release_assets.py \
            --prototype prototype --output artifacts/city/city-asset-audit.json
      - name: Install official checksum-verified Godot engine and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"godot"
          sums={line.split()[-1].lstrip("*"):line.split()[0] for line in (root/"SHA512-SUMS.txt").read_text().splitlines() if line.strip()}
          for local,remote in (("godot.zip","Godot_v4.7.2-stable_linux.x86_64.zip"),("templates.tpz","Godot_v4.7.2-stable_export_templates.tpz")):
              with (root/local).open("rb") as f: actual=hashlib.file_digest(f,"sha512").hexdigest()
              if actual!=sums.get(remote): raise SystemExit("Official Godot SHA512 mismatch: "+remote)
          with zipfile.ZipFile(root/"godot.zip") as z:z.extractall(root)
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"templates/4.7.2.stable"
          with zipfile.ZipFile(root/"templates.tpz") as z:
              for name in ("android_debug.apk","android_release.apk","version.txt"):
                  (target/name).write_bytes(z.read("templates/"+name))
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "TEMPLATE_DIR=$RUNNER_TEMP/templates/4.7.2.stable" >> "$GITHUB_ENV"
      - name: Build the distinct authored Marcus family
        shell: bash
        run: |
          set -euo pipefail
          bash tools/characters/install_marcus_blender.sh "$RUNNER_TEMP/marcus-blender"
          "$RUNNER_TEMP/marcus-blender/blender" -b -t 2 --python-exit-code 1 -P tools/characters/build_marcus.py -- --evidence artifacts/marcus
          python3 tools/characters/validate_hero.py prototype/assets/characters/marcus_quality_{0,1,2,3}.glb --report artifacts/marcus/validation.json
          echo "IMPERATHEN_REQUIRE_MARCUS=1" >> "$GITHUB_ENV"
      - name: Complete native vegetation meshes and distance impostors
        shell: bash
        run: bash tools/integration/prepare_vegetation_assets.sh
      - name: Reconcile three measured kick tracks before functional gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rebake_melee_kicks.py --godot "$GODOT_BIN" --report artifacts/kick-rebake --apply
      - name: Recover exact German dialogue artifacts for the combined source
        uses: actions/download-artifact@v4
        with:
          pattern: german-dialogue-*-46131134266
          path: artifacts/voice-candidates
          run-id: 46131134266
          github-token: ${{ github.token }}
      - name: Recover available seven-line retry results (no paid generation)
        # Missing retry artifacts cannot conceal unrelated engine/asset defects.
        # The strict authored coverage gate below still blocks every missing line.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: german-dialogue-recovery-*-46147196180
          path: artifacts/voice-candidates
          run-id: 46147196180
          github-token: ${{ github.token }}
      - name: Recover targeted Sextus retry if available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: german-dialogue-segmented-sextus-46156428119
          path: artifacts/voice-targeted
          run-id: 46156428119
          github-token: ${{ github.token }}
      - name: Stage accepted German speech before source fingerprint and export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/voice
          "$GODOT_BIN" --headless --path prototype --import --quit
          "$GODOT_BIN" --headless --path prototype --script res://tests/tools/export_dialogue_lines.gd -- "$GITHUB_WORKSPACE/artifacts/voice/authored.json"
          python3 tools/audio/test_voice_contract.py
          python3 tools/audio/test_reanchor_imported_voice_onsets.py
          python3 tools/audio/stage_verified_dialogue.py --authored artifacts/voice/authored.json --candidates artifacts/voice-candidates --report artifacts/voice/staged.json --missing artifacts/voice/missing.json
          # Stage the targeted retry against the already validated manifest:
          # if the general recovery supplied the same line it remains the
          # authoritative recording. Never replace or silently duplicate it.
          if [[ -d artifacts/voice-targeted ]] && find artifacts/voice-targeted -name manifest.fragment.json -print -quit | grep -q .; then
            python3 tools/audio/stage_verified_dialogue.py --authored artifacts/voice/authored.json --candidates artifacts/voice-targeted --report artifacts/voice/staged-targeted.json --missing artifacts/voice/missing.json
            python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("artifacts/voice/staged.json")
          a=json.loads(p.read_text())
          b=json.loads(p.with_name("staged-targeted.json").read_text())
          rows=a["rows"]+b["rows"]
          if len({r["line_id"] for r in rows})!=len(rows):
              raise SystemExit("Duplicate staged recording receipt")
          a.update(staged=len(rows),remaining_unrecorded=b["remaining_unrecorded"],rows=rows,skipped=a["skipped"]+b["skipped"])
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+"\n")
          PY
          fi
          "$GODOT_BIN" --headless --path prototype --import --quit
          "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/dialogue_lipsync_test.gd -- "--measure-staged-onsets=$GITHUB_WORKSPACE/artifacts/voice/staged.json" "--onset-output=$GITHUB_WORKSPACE/artifacts/voice/imported-onsets.json" 2>&1 | tee artifacts/voice/imported-onsets.log
          grep -q IMPORTED_VOICE_ONSETS_PASS artifacts/voice/imported-onsets.log
          python3 tools/audio/reanchor_imported_voice_onsets.py --staged artifacts/voice/staged.json --measured artifacts/voice/imported-onsets.json --report artifacts/voice/onset-derivation.json
          python3 tools/audio/audit_german_dialogue.py artifacts/voice/authored.json --report artifacts/voice/coverage.json
      - name: Real Godot world and all independent release gates on one source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/engine-checks artifacts/city artifacts/voice
          printf 'gate\texit_code\n' > artifacts/release-gates.tsv
          failed=0
          # Each gate runs in a new strict Bash process. Collect failures
          # independently, but never let an unsuccessful gate reach export.
          gate() {
            local name="$1" rc=0
            bash -euo pipefail -c "$name" || rc=$?
            printf '%s\t%s\n' "$name" "$rc" | tee -a artifacts/release-gates.tsv
            if (( rc != 0 )); then failed=1; fi
          }
          engine_full() {
            IMPERATHEN_FULL_ASSET_ACCEPTANCE=1 python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --report artifacts/engine-checks
          }
          export -f engine_full
          real_assets() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/roman_city_real_asset_test.gd \
              2>&1 | tee artifacts/city/real-assets.log
            grep -q ROMAN_CITY_REAL_ASSET_PASS artifacts/city/real-assets.log
          }
          export -f real_assets
          real_walk() {
            IMPERATHEN_REQUIRE_ORIGINAL_YOUTH=1 "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/roman_city_real_walk_test.gd \
              2>&1 | tee artifacts/city/real-walk.log
            grep -q ROMAN_CITY_REAL_WALK_PASS artifacts/city/real-walk.log
            grep -Eq '"original_youth_active":true' artifacts/city/real-walk.log
            grep -Eq '"mocap_active":true' artifacts/city/real-walk.log
          }
          export -f real_walk
          youth_mocap() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/youth_mocap_test.gd \
              2>&1 | tee artifacts/city/youth-mocap-runtime.log
            grep -q YOUTH_MOCAP_RUNTIME_PASS artifacts/city/youth-mocap-runtime.log
          }
          export -f youth_mocap
          i02_props() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/i02_props_test.gd \
              2>&1 | tee artifacts/city/i02-props.log
            grep -q I02_PROPS_PASS artifacts/city/i02-props.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/city/i02-props.log
          }
          export -f i02_props
          city_crowd() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/city_crowd_layout_test.gd \
              2>&1 | tee artifacts/city/crowd.log
            grep -q CITY_CROWD_LAYOUT_PASS artifacts/city/crowd.log
          }
          export -f city_crowd
          city_surface() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/roman_city_surface_visibility_test.gd \
              2>&1 | tee artifacts/city/surface-visibility.log
            grep -q ROMAN_CITY_SURFACE_VISIBILITY_PASS artifacts/city/surface-visibility.log
          }
          export -f city_surface
          portico_walk() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/roman_city_portico_walk_test.gd \
              2>&1 | tee artifacts/city/portico-walk.log
            grep -q ROMAN_CITY_PORTICO_WALK_PASS artifacts/city/portico-walk.log
          }
          export -f portico_walk
          city_routes() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 \
              --script res://tests/roman_city_routes_test.gd \
              2>&1 | tee artifacts/city/routes.log
            grep -q ROMAN_CITY_ROUTES_PASS artifacts/city/routes.log
          }
          export -f city_routes
          quarter_graph() {
            timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/quarter_street_walk_test.gd 2>&1 | tee artifacts/city/quarter-graph.log
            grep -q QUARTER_STREET_WALK_PASS artifacts/city/quarter-graph.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/city/quarter-graph.log
          }
          export -f quarter_graph
          quarter_buildings() {
            timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/roman_quarter_test.gd 2>&1 | tee artifacts/city/quarter-buildings.log
            grep -q ROMAN_QUARTER_PASS artifacts/city/quarter-buildings.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/city/quarter-buildings.log
          }
          export -f quarter_buildings
          voice_coverage() {
            python3 tools/audio/audit_german_dialogue.py artifacts/voice/authored.json --report artifacts/voice/coverage.json --strict
          }
          export -f voice_coverage
          voice_lipsync() {
            "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/dialogue_lipsync_test.gd -- "--authored=$GITHUB_WORKSPACE/artifacts/voice/authored.json" 2>&1 | tee artifacts/voice/full-lipsync.log
            grep -q DIALOGUE_LIPSYNC_PASS artifacts/voice/full-lipsync.log
            ! grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/voice/full-lipsync.log
          }
          export -f voice_lipsync
          motion_quality() {
            python3 tools/motion_quality_gate.py --evidence artifacts/engine-checks
          }
          export -f motion_quality
          for name in city_routes quarter_graph quarter_buildings voice_coverage voice_lipsync real_assets real_walk youth_mocap i02_props city_crowd city_surface portico_walk engine_full motion_quality; do
            gate "$name"
          done
          # A successful export still requires every original gate, including
          # current source-bound motion measurements/reviews and all 170+ lines.
          test "$failed" -eq 0
      - name: Verify Android-safe vegetation in a real Compatibility framebuffer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          bash tools/integration/check_vegetation_safe_render.sh "$GODOT_BIN" artifacts/engine-checks/vegetation-render
      - name: Pin Android SDK, JDK17 and prepare isolated signing identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.1/apksigner" || ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1' 'platforms;android-35'
          fi
          test -x "$JAVA_HOME_17_X64/bin/keytool"
          if [[ -n "$UPDATE_KEYSTORE_B64" && -n "$UPDATE_SIGNER_SHA256" &&
                -n "$UPDATE_KEY_ALIAS" && -n "$UPDATE_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$UPDATE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/original-update-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/original-update-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=$UPDATE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "IMPERATHEN_EXPECTED_SIGNER_SHA256=$UPDATE_SIGNER_SHA256" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$UPDATE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=original_certificate_pin_present" >> "$GITHUB_ENV"
            echo "APK_PACKAGE=at.heinz.imperathen" >> "$GITHUB_ENV"
            echo "QA_PACKAGE_FLAG=" >> "$GITHUB_ENV"
          elif [[ -z "$UPDATE_KEYSTORE_B64" && -z "$UPDATE_SIGNER_SHA256" &&
                  -z "$UPDATE_KEY_ALIAS" && -z "$UPDATE_KEY_PASSWORD" ]]; then
            # A distinct QA application never overwrites the owner's existing
            # IMPERATHEN installation, even with an ephemeral debug certificate.
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -noprompt -keystore "$RUNNER_TEMP/qa-debug.jks" \
              -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
              -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD -alias imperathen-qa \
              -keyalg RSA -keysize 3072 -validity 365 \
              -dname 'CN=IMPERATHEN QA Prototype, O=IMPERATHEN, C=AT'
            echo "KEYSTORE_PATH=$RUNNER_TEMP/qa-debug.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=imperathen-qa" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=isolated_ephemeral_QA_not_update_compatible" >> "$GITHUB_ENV"
            echo "APK_PACKAGE=at.heinz.imperathen.qa" >> "$GITHUB_ENV"
            echo "QA_PACKAGE_FLAG=--qa-package" >> "$GITHUB_ENV"
            echo "ORIGINAL_SIGNING_KEY_MISSING: QA APK only, original IMPERATHEN stays installed."
          else
            echo "Incomplete signing secrets: refusing to build an ambiguous update." >&2
            exit 1
          fi
      - name: Build validated ARM64 Android APK without replacing installed app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mobile
          if [[ "$APK_PACKAGE" == "at.heinz.imperathen" ]]; then
            APK="IMPERATHEN-Fold7-update-${GITHUB_SHA:0:8}.apk"
            args=()
          else
            APK="IMPERATHEN-Fold7-QA-${GITHUB_SHA:0:8}.apk"
            args=(--qa-package)
          fi
          python3 tools/build_android_prototype.py \
            --godot "$GODOT_BIN" --sdk-root "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" --template-dir "$TEMPLATE_DIR" \
            --keystore "$KEYSTORE_PATH" --keystore-user "$KEYSTORE_ALIAS" \
            --motion-evidence artifacts/engine-checks \
            --abi arm64-v8a --renderer compatibility \
            --output "artifacts/mobile/$APK" --timeout 900 "${args[@]}"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs \
            "artifacts/mobile/$APK" > artifacts/mobile/certificate-proof.txt
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("artifacts/mobile")
          name=next(x for x in p.glob("IMPERATHEN-*.apk") if x.is_file())
          manifest={"apk":name.name,"package":os.environ["APK_PACKAGE"],
            "signing_mode":os.environ["SIGNING_MODE"],
            "installed_original_app_not_modified":True,
            "original_update_install_verified_on_fold7":False,
            "physical_fold7_20min_qa":"not_run",
            "temple_private_model_required_for_full_release":
              not pathlib.Path("prototype/assets/world/roman_temple_review.json").exists()}
          (p/"DELIVERY_STATUS.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("ANDROID_ARTIFACT_PREVIEW "+json.dumps(manifest))
          PY
          sha256sum artifacts/mobile/*.apk > artifacts/mobile/SHA256SUMS.txt
      - name: Upload real APK and exact source-and-engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-fold7-qa-apk-${{ github.run_number }}
          path: |
            artifacts/source-commit.txt
            artifacts/release-gates.tsv
            artifacts/mobile/
            artifacts/city/
            artifacts/engine-checks/
            artifacts/marcus/
            artifacts/kick-rebake/
            artifacts/voice/
          if-no-files-found: warn
          retention-days: 30

  actual-city-visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Real framebuffer rendering setup
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-scipy python3-pil xvfb xauth libgl1-mesa-dri mesa-utils
          mkdir -p "$RUNNER_TEMP/godot" artifacts/visual prototype/assets/world
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          name='Godot_v4.7.2-stable_linux.x86_64.zip'
          expected={x.split()[-1].lstrip('*'):x.split()[0] for x in Path('SHA512-SUMS.txt').read_text().splitlines() if x.strip()}
          with open(name,'rb') as f: actual=hashlib.file_digest(f,'sha512').hexdigest()
          if actual!=expected.get(name):raise SystemExit('Godot checksum mismatch')
          with zipfile.ZipFile(name) as z:z.extractall()
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import the user's already rigged original boy without new secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/characters/stage_original_youth.py \
            --archive "$RUNNER_TEMP/imperathen-original-youth-runtime.zip" \
            --report artifacts/visual/original-youth-status.json
          test -s prototype/assets/characters/hero_meshy_italia_0.glb
      - name: Retarget recorded human walk run and unarmed combat onto the exact original youth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/youth-mocap"
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 'https://accad.ohio-state.edu/sites/accad.osu.edu/files/Male2_bvh.zip' -o "$RUNNER_TEMP/accad-male2.zip"
          # The story explicitly requests the original youth in civilian clothing.
          # Build that private derivative from the pristine sources BEFORE the
          # armoured retarget overwrites them. Never commit private GLBs.
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/stage_youth_civil.py \
            --source prototype/assets/characters --accad-archive "$RUNNER_TEMP/accad-male2.zip" \
            --work "$RUNNER_TEMP/youth-civil"
          for lod in 0 1 2 3; do test -s "prototype/assets/characters/hero_meshy_italia_civil_$lod.glb"; done
          test -s prototype/assets/animations/accad_youth_civil_motion.json
          OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 /usr/bin/python3 tools/characters/retarget_accad_youth.py \
            --archive "$RUNNER_TEMP/accad-male2.zip" --input prototype/assets/characters \
            --output "$RUNNER_TEMP/youth-mocap" --report artifacts/visual/youth-mocap-report.json
          cp "$RUNNER_TEMP"/youth-mocap/hero_meshy_italia_*.glb prototype/assets/characters/
          cp artifacts/visual/youth-mocap-report.json prototype/assets/animations/accad_youth_motion.json
      - name: Build exact original city and import visual scene
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 1 --python tools/world/build_roman_test_city.py -- \
            --output "$RUNNER_TEMP/roman-visual" --surface-style viva --texture-size 1024 \
            > artifacts/visual/blender.log 2>&1
          cp "$RUNNER_TEMP/roman-visual/imperathen_roman_test_city.glb" prototype/assets/world/roman_city_test.glb
          cp "$RUNNER_TEMP/roman-visual/roman_city_collision.glb" prototype/assets/world/roman_city_collision.glb
          cp "$RUNNER_TEMP/roman-visual/city_manifest.json" prototype/assets/world/roman_city_manifest.json
          "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/visual/godot-import.log
          # Fail on script compilation before invoking costly rendered captures.
          "$GODOT_BIN" --headless --path prototype --check-only --script res://tests/roman_city_visual_capture.gd 2>&1 | tee artifacts/visual/capture-script-check.log
      - name: Capture High and Very High actual Godot city at same three viewpoints
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for preset in high very_high; do
            export IMPERATHEN_CITY_RENDER_PROFILE="$preset"
            export IMPERATHEN_CITY_RENDER_OUTPUT="$GITHUB_WORKSPACE/artifacts/visual"
            log="artifacts/visual/$preset.log"
            # Capture both profiles even if one fails; retain a failing job status.
            if ! xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" \
              --path prototype --audio-driver Dummy --rendering-method gl_compatibility \
              --fixed-fps 60 --script res://tests/roman_city_visual_capture.gd \
              2>&1 | tee "$log"; then failed=1; fi
            if ! grep -q ROMAN_CITY_VISUAL_PASS "$log"; then failed=1; fi
            if ! grep -Eq '"original_youth_active":true' "$log"; then failed=1; fi
            if ! grep -Eq '"mocap_active":true' "$log"; then failed=1; fi
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$log"; then failed=1; fi
          done
          exit "$failed"
      - name: Save unedited city framebuffers and actual renderer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-city-original-framebuffers-${{ github.run_number }}
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 30
