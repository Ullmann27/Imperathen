name: Aeterna predictive terrain support
on:
  push:
    branches: ['fix/aeterna-terrain-predictive-support-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Run existing and new physical terrain tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --only world_stream_plan regional_terrain --report artifacts/terrain-support
      - name: Replay the actual long-distance footpath with movement prediction
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d "$RUNNER_TEMP/terrain-route.XXXXXX")"
          mkdir -p "$state"/{data,config,cache}
          XDG_DATA_HOME="$state/data" XDG_CONFIG_HOME="$state/config" XDG_CACHE_HOME="$state/cache" timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/regional_footpath_test.gd 2>&1 | tee artifacts/terrain-support/regional_footpath.log
          grep -Fq 'REGIONAL_FOOTPATH ' artifacts/terrain-support/regional_footpath.log
          python3 - <<'PY'
          import json, pathlib
          line = next(s for s in pathlib.Path('artifacts/terrain-support/regional_footpath.log').read_text().splitlines() if s.startswith('REGIONAL_FOOTPATH '))
          report = json.loads(line.removeprefix('REGIONAL_FOOTPATH '))
          assert report['failures'] == [], report['failures']
          PY
      - name: Preserve exact logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-terrain-support-${{ github.run_id }}
          path: artifacts/terrain-support/
          if-no-files-found: warn
          retention-days: 30
