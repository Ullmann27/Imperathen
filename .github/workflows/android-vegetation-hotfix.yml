name: Android vegetation regression – actual static plant geometry and game frames
on:
  push:
    branches: ['fix/android-vegetation-render-20261126', 'fix/fold7-device-visual-gameplay-recovery-20261126']
permissions:
  contents: read
concurrency:
  group: android-vegetation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framebuffer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare authored vegetation and display
        run: |
          set -euo pipefail
          mkdir -p artifacts/vegetation
          git rev-parse HEAD > artifacts/vegetation/SOURCE_COMMIT.txt
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil xvfb xauth libgl1-mesa-dri
          bash tools/integration/prepare_vegetation_assets.sh
      - name: Install verified Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          file="Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLsS --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fLsS --retry 3 "$base/$file" -o "$file"
          awk -v n="$file" '$2 == n || $2 == "*" n {print $1 "  " n}' SHA512-SUMS.txt > selected.sha512
          test "$(wc -l < selected.sha512)" -eq 1
          sha512sum -c selected.sha512
          unzip -q "$file"
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and verify the ordinary and safe vegetation paths
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --only import vegetation vegetation_safe --report artifacts/vegetation/headless
      - name: Reject stretched pixels and capture actual menu, I-00, family, well and meadow
        run: bash tools/integration/check_vegetation_safe_render.sh "$GODOT_BIN" artifacts/vegetation/framebuffers
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-android-vegetation-${{ github.run_id }}
          path: artifacts/vegetation/
          if-no-files-found: error
          retention-days: 30
