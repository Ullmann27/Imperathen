name: AETERNA moving soldier LOD sole contact measurement
on:
  pull_request:
    branches: ['fix/aeterna-tribal-guard-pose-20261128']
    types: [opened, synchronize, reopened]
    paths: ['prototype/tests/formation_stride_contact_test.gd', '.github/workflows/aeterna-formation-stride-contact.yml']
permissions:
  contents: read
concurrency:
  group: aeterna-formation-stride-contact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'qa/aeterna-formation-stride-contact-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pin source and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/formation-stride
          git rev-parse HEAD > artifacts/formation-stride/source.txt
          git hash-object prototype/tests/formation_stride_contact_test.gd > artifacts/formation-stride/test-blob.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Real moving-soldier sole measurement
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/stride-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/stride-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/stride-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/formation-stride/import.log
          status=0
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/formation_stride_contact_test.gd 2>&1 | tee artifacts/formation-stride/test.log || status=$?
          grep '^STRIDE_WORST ' artifacts/formation-stride/test.log > artifacts/formation-stride/worst.jsonl || true
          grep '^FORMATION_STRIDE_RESULT ' artifacts/formation-stride/test.log > artifacts/formation-stride/summary.txt || true
          test "$status" -eq 0
          grep -Fxq FORMATION_STRIDE_PASS artifacts/formation-stride/test.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:|^STRIDE_FAIL ' artifacts/formation-stride/test.log; then exit 1; fi
      - name: Retain real source-bound measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-formation-stride-${{ github.run_id }}
          path: artifacts/formation-stride/
          if-no-files-found: warn
          retention-days: 14
