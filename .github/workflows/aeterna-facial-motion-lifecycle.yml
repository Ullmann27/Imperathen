name: AETERNA facial LOD lifecycle verification
on:
  pull_request:
    branches: ['integration/aeterna-visual-mounted-20261128']
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/aeterna-facial-motion-lifecycle.yml']
permissions:
  contents: read
concurrency:
  group: aeterna-facial-motion-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'fix/aeterna-facial-lod-lifecycle-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record exact source blobs and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/facial-lod
          git rev-parse HEAD > artifacts/facial-lod/source.txt
          git hash-object prototype/scripts/visuals/facial_motion.gd | tee artifacts/facial-lod/module-blob.txt
          git hash-object prototype/tests/facial_motion_lifecycle_test.gd | tee artifacts/facial-lod/test-blob.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Import and run actual facial LOD regression
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/facial-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/facial-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/facial-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/facial-lod/import.log
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --script res://tests/facial_motion_lifecycle_test.gd 2>&1 | tee artifacts/facial-lod/test.log
          grep -Fxq FACIAL_LOD_PASS artifacts/facial-lod/test.log
          grep -Eq '^FACIAL_LOD_RESULT checks=[1-9][0-9]* failures=0$' artifacts/facial-lod/test.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:|FACIAL_LOD_FAIL' artifacts/facial-lod/test.log; then exit 1; fi
      - name: Preserve source-bound test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-facial-lod-${{ github.run_id }}
          path: artifacts/facial-lod/
          if-no-files-found: warn
          retention-days: 14
