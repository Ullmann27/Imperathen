name: Android prototype APK

on:
  push:
    branches: ['feature/prototype-foundation-20261122', 'integration/android-formation-20261122']
    paths:
      - 'prototype/**'
      - 'tools/build_android_prototype.py'
      - 'tools/validate_android_apk.py'
      - 'tools/android_runtime_smoke.py'
      - 'tools/android_signing_recovery_public.crt'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install and verify the matching official Godot templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates/4.7.2.stable" artifacts
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" --output godot.zip
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" --output templates.tpz
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot'
          sums={line.split()[-1].lstrip('*'):line.split()[0] for line in (root/'SHA512-SUMS.txt').read_text().splitlines() if line.strip()}
          for local, remote in [('godot.zip','Godot_v4.7.2-stable_linux.x86_64.zip'),('templates.tpz','Godot_v4.7.2-stable_export_templates.tpz')]:
              with (root/local).open('rb') as stream:
                  digest=hashlib.file_digest(stream,'sha512').hexdigest()
              if digest != sums.get(remote): raise SystemExit('Official checksum mismatch: '+remote)
          with zipfile.ZipFile(root/'godot.zip') as z: z.extractall(root)
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'templates/4.7.2.stable'
          with zipfile.ZipFile(root/'templates.tpz') as z:
              for name in ('android_debug.apk','android_release.apk','linux_debug.x86_64','windows_debug_x86_64.exe','version.txt'):
                  (target/name).write_bytes(z.read('templates/'+name))
          PY
          rm templates.tpz godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "IMPERATHEN_TEMPLATE_DIR=$RUNNER_TEMP/templates/4.7.2.stable" >> "$GITHUB_ENV"
      - name: Check SDK and create a recoverable private prototype signing key
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.1/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1' 'platforms;android-35'
          fi
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore "$RUNNER_TEMP/imperathen-debug.keystore" -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD -alias imperathen-debug -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=IMPERATHEN Prototype, O=IMPERATHEN, C=AT'
          openssl cms -encrypt -binary -aes-256-gcm -in "$RUNNER_TEMP/imperathen-debug.keystore" -outform DER -out artifacts/android-debug-keystore.cms tools/android_signing_recovery_public.crt
          cp tools/android_signing_recovery_public.crt artifacts/
      - name: Run existing engine regression checks
        run: python3 tools/check_prototype.py --godot "$GODOT_BIN" --report artifacts/engine-checks
      - name: Export the installable ARM64 prototype
        run: |
          python3 tools/build_android_prototype.py --godot "$GODOT_BIN" --sdk-root "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --template-dir "$IMPERATHEN_TEMPLATE_DIR" --keystore "$RUNNER_TEMP/imperathen-debug.keystore" --keystore-user imperathen-debug --abi arm64-v8a --output "$GITHUB_WORKSPACE/artifacts/IMPERATHEN-0.1.0-arm64.apk"
          python3 tools/validate_android_apk.py --apk artifacts/IMPERATHEN-0.1.0-arm64.apk --sdk-root "$ANDROID_HOME" --report artifacts/arm64-apk-validation.json
      - name: Export a separate Android emulator test package
        run: |
          python3 tools/build_android_prototype.py --godot "$GODOT_BIN" --sdk-root "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --template-dir "$IMPERATHEN_TEMPLATE_DIR" --keystore "$RUNNER_TEMP/imperathen-debug.keystore" --keystore-user imperathen-debug --abi x86_64 --output "$GITHUB_WORKSPACE/artifacts/IMPERATHEN-0.1.0-emulator.apk"
          python3 tools/validate_android_apk.py --apk artifacts/IMPERATHEN-0.1.0-emulator.apk --sdk-root "$ANDROID_HOME" --expected-abi x86_64 --report artifacts/emulator-apk-validation.json
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-commit.txt
      - name: Upload the completed APK and build proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-android-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Export Linux and Windows desktop builds
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" desktop
          ln -s "$IMPERATHEN_TEMPLATE_DIR" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          "$GODOT_BIN" --headless --path prototype --export-debug "Linux x86_64" "$PWD/desktop/IMPERATHEN.x86_64"
          "$GODOT_BIN" --headless --path prototype --export-debug "Windows x86_64" "$PWD/desktop/IMPERATHEN.exe"
          desktop/IMPERATHEN.x86_64 --headless --quit-after 3 | tee desktop/linux-start.log
          grep -q IMPERATHEN_READY desktop/linux-start.log
          (cd desktop && sha256sum IMPERATHEN.* > SHA256SUMS.txt && tar czf IMPERATHEN-linux-x86_64.tar.gz IMPERATHEN.x86_64)
      - name: Upload desktop builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-desktop-${{ github.run_number }}
          path: |
            desktop/*.tar.gz
            desktop/*.exe
            desktop/*.txt
            desktop/*.log
          retention-days: 30
      - name: Start a real Android emulator and inspect the app runtime
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          image='system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name imperathen --device pixel_6 --path "$ANDROID_AVD_HOME/imperathen.avd" --package "$image"
          test -f "$ANDROID_AVD_HOME/imperathen.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/platform-tools/adb" start-server
          df -h "$RUNNER_TEMP"
          "$ANDROID_HOME/emulator/emulator" -avd imperathen -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -memory 2048 -partition-size 2048 > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'tail -80 "$RUNNER_TEMP/android-emulator.log"; kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 tools/android_runtime_smoke.py --adb "$ANDROID_HOME/platform-tools/adb" --apk artifacts/IMPERATHEN-0.1.0-emulator.apk --output android-runtime
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-android-runtime-${{ github.run_number }}
          path: |
            android-runtime/
            ${{ runner.temp }}/android-emulator.log
          if-no-files-found: warn
          retention-days: 30
