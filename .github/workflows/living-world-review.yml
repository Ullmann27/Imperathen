name: Team B – Living World prüfen

on:
  push:
    branches: ['feature/team-b-living-world-20261124']
    paths:
      - 'prototype/**'
      - 'tools/check_prototype.py'
      - 'tools/capture_living_world_comparison.py'
      - '.github/workflows/living-world-review.yml'

permissions:
  contents: read

concurrency:
  group: living-world-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions-and-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      BASELINE_COMMIT: '7a21dca5dad83bf637cfbe9c02f4d9ab5cd97337'
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offizielle Engine und feste Prüfszene vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/team-b-review" team-b-evidence
          cp tools/capture_companion_comparison.py tools/capture_living_world_comparison.py prototype/tests/team_b_review.gd "$RUNNER_TEMP/team-b-review/"
          git rev-parse HEAD > "$RUNNER_TEMP/team-b-review/feature-commit.txt"
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          curl --fail --location --retry 3 "$release/$archive" --output "$archive"
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd()
          name = 'Godot_v4.7.2-stable_linux.x86_64.zip'
          sums = {line.split()[-1].lstrip('*'):line.split()[0] for line in (root/'SHA512-SUMS.txt').read_text().splitlines() if line.strip()}
          with (root/name).open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha512').hexdigest()
          if actual != sums.get(name):
              raise SystemExit('Offizielle Engine-Prüfsumme stimmt nicht überein')
          with zipfile.ZipFile(root/name) as archive:
              archive.extractall(root)
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y xvfb xauth
          fi
      - name: Gemeinsame Python- und Engineprüfungen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'android_*_test.py' 2>&1 | tee team-b-evidence/python.log
          python3 tools/check_prototype.py --godot "$GODOT_BIN" --keep-going --report team-b-evidence/engine
      - name: Ausgangsstand mit identischer Kamera erfassen
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$BASELINE_COMMIT"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 "$RUNNER_TEMP/team-b-review/capture_living_world_comparison.py" \
            --godot "$GODOT_BIN" --project "$GITHUB_WORKSPACE/prototype" \
            --script "$RUNNER_TEMP/team-b-review/team_b_review.gd" \
            --output "$GITHUB_WORKSPACE/team-b-evidence/before" --label before
      - name: Team-B-Stand erfassen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          for entry in subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z','--','prototype']).decode().split('\0'):
              if entry.endswith('.gd.uid'):
                  pathlib.Path(entry).unlink()
          cache = pathlib.Path('prototype/.godot')
          if cache.is_symlink():
              cache.unlink()
          elif cache.is_dir():
              shutil.rmtree(cache)
          PY
          feature_commit="$(cat "$RUNNER_TEMP/team-b-review/feature-commit.txt")"
          git switch --detach "$feature_commit"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 "$RUNNER_TEMP/team-b-review/capture_living_world_comparison.py" \
            --godot "$GODOT_BIN" --project "$GITHUB_WORKSPACE/prototype" \
            --script "$RUNNER_TEMP/team-b-review/team_b_review.gd" \
            --output "$GITHUB_WORKSPACE/team-b-evidence/after" --label after
      - name: Kameras, Quellen und Bildprüfsummen vergleichen
        run: |
          python3 "$RUNNER_TEMP/team-b-review/capture_living_world_comparison.py" --compare \
            --before team-b-evidence/before --after team-b-evidence/after --output team-b-evidence
      - name: Prüfnachweise bereitstellen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-team-b-${{ github.run_number }}
          path: team-b-evidence/
          if-no-files-found: error
          retention-days: 30
