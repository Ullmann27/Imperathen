name: AETERNA market pitcher contact regression
on:
  push:
    branches: ['fix/aeterna-market-jug-grip-20261127']
permissions:
  contents: read
concurrency:
  group: market-jug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Import and execute the real I03 flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/market-jug
          git rev-parse HEAD > artifacts/market-jug/source.txt
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee artifacts/market-jug/import.log
          timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script res://tests/i03_flow_test.gd 2>&1 | tee artifacts/market-jug/test.log
          grep -Fq I03_FLOW_PASS artifacts/market-jug/test.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' artifacts/market-jug/test.log; then exit 1; fi
      - name: Capture the actual service and pitcher in Compatibility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout --kill-after=10s 900s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_BIN" --path prototype --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script res://tests/i03_flow_test.gd -- --capture-dir="$PWD/artifacts/market-jug/frames" --size=1280x720 2>&1 | tee artifacts/market-jug/render.log
          grep -Fq I03_FLOW_PASS artifacts/market-jug/render.log
          test -s artifacts/market-jug/frames/1280x720-i03-well-jug.png
          sha256sum artifacts/market-jug/frames/*.png > artifacts/market-jug/FRAME_SHA256.txt
          printf '%s\n' 'Candidate captures only; independent V1/V2 and physical device review pending.' > artifacts/market-jug/REVIEW_PENDING.txt
      - name: Preserve source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-jug-contact-${{ github.run_id }}
          path: artifacts/market-jug/
          if-no-files-found: warn
          retention-days: 14
