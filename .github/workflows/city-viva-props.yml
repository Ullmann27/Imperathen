name: Roman city VIVA close-up props integration
on:
  pull_request:
    paths:
      - 'prototype/scripts/rendering/city_viva_closeup_props.gd'
      - 'prototype/scripts/world/city_exploration.gd'
      - 'prototype/tests/city_viva_props_test.gd'
      - 'tools/check_prototype.py'
      - '.github/workflows/city-viva-props.yml'
  push:
    branches: ['fix/city-graphics-release-blockers-20261125']

permissions:
  contents: read

concurrency:
  group: city-viva-props-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packed-scenes-and-original-city:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GODOT_VERSION: 4.7.2
      GODOT_SILENCE_ROOT_WARNING: '1'
      IMPERATHEN_ISOLATED_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Official verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$url/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          curl --fail --location --retry 3 "$url/$name" --output "$name"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          name='Godot_v4.7.2-stable_linux.x86_64.zip'
          sums={line.split()[-1].lstrip('*'):line.split()[0] for line in Path('SHA512-SUMS.txt').read_text().splitlines() if line.strip()}
          with open(name,'rb') as f: value=hashlib.file_digest(f,'sha512').hexdigest()
          if value != sums.get(name): raise SystemExit('Official Godot SHA512 mismatch')
          with zipfile.ZipFile(name) as archive: archive.extractall()
          PY
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Validate real packed scene imports and preserved city geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_prototype.py --godot "$GODOT_BIN" \
            --keep-going --only import city_viva_props city_exploration_detail \
            --report artifacts/city-viva
      - name: Preserve machine-checked results and source fingerprint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imperathen-city-viva-${{ github.run_number }}
          path: artifacts/city-viva/
          if-no-files-found: warn
          retention-days: 14
