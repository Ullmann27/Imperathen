name: AETERNA actual city resident loading and departure
on:
  push:
    branches: ['fix/aeterna-city-resident-departure-20261128']
permissions:
  contents: read
concurrency:
  group: aeterna-city-resident-departure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      IMPERATHEN_ISOLATED_TEST: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin candidate source and install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" artifacts/city-departure
          git rev-parse HEAD > artifacts/city-departure/source.txt
          git hash-object prototype/scripts/world/city_resident_view.gd > artifacts/city-departure/runtime-blob.txt
          git hash-object prototype/tests/city_resident_departure_test.gd > artifacts/city-departure/test-blob.txt
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$base/$file" -o "$file"
          expected="$(awk -v name="$file" '$NF == name || $NF == "*" name {print $1}' SHA512-SUMS.txt)"
          test -n "$expected" && test "$expected" = "$(sha512sum "$file" | awk '{print $1}')"
          unzip -q "$file"
          chmod +x "${file%.zip}"
          echo "GODOT_BIN=$PWD/${file%.zip}" >> "$GITHUB_ENV"
      - name: Verify actual departure, city life and resident activity
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/city-departure"
          timeout --kill-after=10s 600s "$GODOT_BIN" --headless --path prototype --import --quit 2>&1 | tee "$out/import.log"
          status=0
          run_check() {
            local label="$1" marker="$2" state
            state="$(mktemp -d "$RUNNER_TEMP/city-departure.XXXXXX")"
            mkdir -p "$state"/{data,config,cache}
            if ! XDG_DATA_HOME="$state/data" XDG_CONFIG_HOME="$state/config" XDG_CACHE_HOME="$state/cache" timeout --kill-after=10s 420s "$GODOT_BIN" --headless --path prototype --fixed-fps 60 --script "res://tests/$label.gd" 2>&1 | tee "$out/$label.log"; then status=1; fi
            if ! grep -Fq "$marker" "$out/$label.log" || grep -Eq 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$out/$label.log"; then status=1; fi
          }
          run_check city_resident_departure_test CITY_RESIDENT_DEPARTURE_PASS
          run_check city_life_test CITY_LIFE_PASS
          run_check resident_activity_test RESIDENT_ACTIVITY_PASS
          run_check city_ambient_people_test CITY_AMBIENT_PEOPLE_PASS
          exit "$status"
      - name: Retain actual engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeterna-city-departure-${{ github.run_id }}
          path: artifacts/city-departure/
          if-no-files-found: warn
          retention-days: 14
